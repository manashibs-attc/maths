d minimum<\/b><br>sin θ and cos θ range from −1 to +1, so <span class=\"v\">V: +230 V / −230 V<\/span> and <span class=\"i\">I: +10 A / −10 A<\/span>.<\/div>\n  <div class=\"st\"><b class=\"h\">9. Why sine and cosine matter in AC systems<\/b><br>\n    • A generator coil rotating in a magnetic field produces a voltage proportional to sin θ.<br>\n    • Sinusoidal waves are smooth, so motors, transformers and cables work efficiently.<br>\n    • A cosine current is a sine shifted by 90°. Capacitive circuits make current lead voltage; inductive circuits make it lag.<br>\n    • Phase differences decide real power, power factor and the sizing of equipment.<br>\n    <span class=\"note\">Note: household “230 V” is usually an RMS value. Here 230 V is the peak value, as given in the problem.<\/span><\/div>\n  <div class=\"st\"><b class=\"h\">Bonus: 50 Hz → 60 Hz<\/b><br>T = 1/f: 1/50 = 20 ms, 1/60 ≈ 16.67 ms. Press the 60 Hz button: the dashed blue curve is the old 50 Hz wave.<br>\n    <span class=\"res\">Why does a higher frequency give a smaller period?<\/span> Frequency is the number of cycles per second. If more cycles must fit into one second, each cycle must be shorter, so T = 1/f decreases.<\/div>`;\n}\n\nfunction jump(t) { tc = t; playing = false; $('play').textContent = '▶ Play'; $('ts').value = t / WIN * 1000; }\nfunction setF(v) {\n  f = v; $('f50').classList.toggle('on', v === 50); $('f60').classList.toggle('on', v === 60);\n  tc = 0; solution();\n}\n$('f50').onclick = () => setF(50);\n$('f60').onclick = () => setF(60);\n$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '⏸ Pause' : '▶ Play'; };\n$('spd').oninput = e => speed = +e.target.value;\n$('ts').oninput = e => { playing = false; $('play').textContent = '▶ Play'; tc = e.target.value / 1000 * WIN; };\n\nfunction loop(now) {\n  const dt = (now - last) / 1000; last = now;\n  if (playing) { tc += dt * (WIN / 6) * speed; if (tc > WIN) tc -= WIN; $('ts').value = tc / WIN * 1000; }\n  drawGraph(); drawPhasor(); readout();\n  requestAnimationFrame(loop);\n}\nsolution();\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>"}, {"label": "〰️ Fourier Square Wave", "file": "wave_.html", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Fourier Series of a Square Wave – Animated<\/title>\n<style>\n  * { box-sizing: border-box; }\n  body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg,#141e30,#243b55); color: #fff; }\n  header { text-align: center; padding: .6rem; }\n  header h1 { margin: 0; font-size: 1.4rem; color: #ffd54f; }\n  header div { font-size: .85rem; opacity: .85; }\n  .main { display: flex; flex-wrap: wrap; gap: 12px; max-width: 1200px; margin: auto; padding: 0 10px; }\n  .text { flex: 1 1 380px; background: rgba(255,255,255,.1); border-radius: 14px; padding: 12px 16px; min-height: 420px; }\n  .text h2 { margin: 0 0 8px; color: #80deea; font-size: 1.2rem; }\n  .line { opacity: 0; transform: translateX(-15px); transition: all .6s; margin: 7px 0; line-height: 1.55; font-size: 1.02rem; }\n  .line.show { opacity: 1; transform: none; }\n  .hl { background: rgba(255,213,79,.18); border-left: 4px solid #ffd54f; padding: 4px 8px; border-radius: 4px; }\n  .res { color: #b9f6ca; font-weight: bold; }\n  .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 3px; font-size: .95em; }\n  .frac span:first-child { border-bottom: 2px solid #fff; padding: 0 4px; }\n  .cv { flex: 1 1 560px; }\n  canvas { width: 100%; background: #0e1726; border-radius: 14px; border: 2px solid #3b5575; }\n  #label { text-align: center; font-size: 1rem; min-height: 1.6rem; color: #ffe082; margin-top: 4px; }\n  .controls { text-align: center; margin: 10px 0; }\n  button { background: #ffd54f; color: #222; border: 0; border-radius: 8px; padding: .5rem 1.1rem; font-weight: bold; font-size: 1rem; cursor: pointer; margin: 2px; }\n  button:disabled { opacity: .4; cursor: default; }\n  .dots { text-align: center; margin-bottom: 10px; }\n  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #55708f; margin: 0 3px; cursor: pointer; }\n  .dot.on { background: #ffd54f; transform: scale(1.3); }\n  .legend { text-align: center; font-size: .85rem; margin-top: 4px; }\n  .legend span { margin: 0 8px; }\n<\/style>\n<\/head>\n<body>\n<header>\n  <h1>Fourier Series of a Square Wave<\/h1>\n  <div>Engineering Mathematics · Diploma Engineering<\/div>\n<\/header>\n\n<div class=\"main\">\n  <div class=\"text\"><h2 id=\"stepTitle\"><\/h2><div id=\"stepBody\"><\/div><\/div>\n  <div class=\"cv\">\n    <canvas id=\"cv\" width=\"680\" height=\"380\"><\/canvas>\n    <div id=\"label\"><\/div>\n    <div class=\"legend\">\n      <span style=\"color:#4fc3f7\">━ f(x) square wave<\/span>\n      <span style=\"color:#ffb74d\">━ Fourier approximation<\/span>\n      <span style=\"color:#a5d6a7\">┄ harmonics<\/span>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"controls\">\n  <button id=\"prev\" onclick=\"go(-1)\">⏮ Back<\/button>\n  <button id=\"auto\" onclick=\"toggleAuto()\">▶ Auto-play<\/button>\n  <button id=\"next\" onclick=\"go(1)\">Next ⏭<\/button>\n<\/div>\n<div class=\"dots\" id=\"dots\"><\/div>\n\n<script>\nconst PI = Math.PI;\nconst fr = (n, d) => `<span class=\"frac\"><span>${n}<\/span><span>${d}<\/span><\/span>`;\nconst INT = (a, b) => `∫<sub>${a}<\/sub><sup>${b}<\/sup>`;\n\nconst steps = [\n  { t: '1. The problem', mode: 'square', label: 'One period of the square wave repeats every 2π',\n    lines: [\n      'f(x) = 1 for 0 &lt; x &lt; π, &nbsp; f(x) = −1 for −π &lt; x &lt; 0, &nbsp; period = 2π.',\n      '<div class=\"hl\">Fourier series: f(x) = ' + fr('a₀', 2) + ' + Σ (aₙ cos nx + bₙ sin nx)<\/div>',\n      'a₀ = ' + fr(1, 'π') + INT('−π', 'π') + ' f(x) dx',\n      'aₙ = ' + fr(1, 'π') + INT('−π', 'π') + ' f(x) cos nx dx',\n      'bₙ = ' + fr(1, 'π') + INT('−π', 'π') + ' f(x) sin nx dx'\n    ] },\n  { t: '2. Even, odd or neither?', mode: 'odd', label: 'The orange point Q = (−x, f(−x)) mirrors P through the origin',\n    lines: [\n      'Take 0 &lt; x &lt; π. Then −x lies in (−π, 0), so f(−x) = −1.',\n      'But f(x) = 1, therefore <b>f(−x) = −f(x)<\/b>.',\n      'The graph is symmetric about the origin (rotating it by 180° gives the same graph).',\n      '<div class=\"hl res\">The function is ODD.<\/div>',\n      'Consequence: a₀ = 0 and aₙ = 0. Only <b>sine terms<\/b> remain.'\n    ] },\n  { t: '3. Finding a₀', mode: 'square', label: 'Area above the axis cancels area below it: average value = 0',\n    lines: [\n      'a₀ = ' + fr(1, 'π') + '[ ' + INT('−π', 0) + '(−1) dx + ' + INT(0, 'π') + '(1) dx ]',\n      'a₀ = ' + fr(1, 'π') + '[ −π + π ]',\n      '<div class=\"hl res\">a₀ = 0<\/div>',\n      '<i>Physical meaning:<\/i> the DC (average) component is zero, so the wave is centred on the axis.'\n    ] },\n  { t: '4. Finding aₙ', mode: 'square', label: 'cos nx is even, f(x) is odd: the product is odd and integrates to 0',\n    lines: [\n      'aₙ = ' + fr(1, 'π') + '[ −' + INT('−π', 0) + 'cos nx dx + ' + INT(0, 'π') + 'cos nx dx ]',\n      'aₙ = ' + fr(1, 'π') + '[ −' + fr('sin nx', 'n') + '|<sub>−π<\/sub><sup>0<\/sup> + ' + fr('sin nx', 'n') + '|<sub>0<\/sub><sup>π<\/sup> ]',\n      'Since sin nπ = 0 and sin 0 = 0 for every integer n:',\n      '<div class=\"hl res\">aₙ = 0<\/div>'\n    ] },\n  { t: '5. Finding bₙ', mode: 'square', label: 'Only odd n survive, with bₙ = 4 / (nπ)',\n    lines: [\n      'bₙ = ' + fr(1, 'π') + '[ −' + INT('−π', 0) + 'sin nx dx + ' + INT(0, 'π') + 'sin nx dx ]',\n      INT(0, 'π') + 'sin nx dx = ' + fr('1 − cos nπ', 'n') + ' &nbsp;and&nbsp; ' + INT('−π', 0) + 'sin nx dx = −' + fr('1 − cos nπ', 'n'),\n      'bₙ = ' + fr(1, 'π') + ' × 2 × ' + fr('1 − cos nπ', 'n') + ' = ' + fr('2[1 − (−1)ⁿ]', 'nπ'),\n      '• n odd: (−1)ⁿ = −1 → <span class=\"res\">bₙ = ' + fr(4, 'nπ') + '<\/span>',\n      '• n even: (−1)ⁿ = 1 → <span class=\"res\">bₙ = 0<\/span>'\n    ] },\n  { t: '6. The Fourier series', mode: 'square', label: 'f(x) = (4/π)[ sin x + ⅓ sin 3x + ⅕ sin 5x + … ]',\n    lines: [\n      'Substitute a₀ = 0, aₙ = 0 and bₙ = 4/(nπ) for odd n:',\n      '<div class=\"hl res\">f(x) = ' + fr(4, 'π') + '[ sin x + ' + fr(1, 3) + ' sin 3x + ' + fr(1, 5) + ' sin 5x + … ]<\/div>',\n      'or &nbsp; f(x) = ' + fr(4, 'π') + ' Σ<sub>k=1<\/sub><sup>∞<\/sup> ' + fr('sin (2k−1)x', '2k − 1')\n    ] },\n  { t: '7. First three non-zero terms', mode: 'harm', label: 'Fundamental, 3rd and 5th harmonics are added one by one',\n    lines: [\n      '1st: ' + fr(4, 'π') + ' sin x ≈ <span class=\"res\">1.2732 sin x<\/span>',\n      '2nd: ' + fr(4, '3π') + ' sin 3x ≈ <span class=\"res\">0.4244 sin 3x<\/span>',\n      '3rd: ' + fr(4, '5π') + ' sin 5x ≈ <span class=\"res\">0.2546 sin 5x<\/span>',\n      '<div class=\"hl\">f(x) ≈ 1.2732 sin x + 0.4244 sin 3x + 0.2546 sin 5x<\/div>',\n      '(The even harmonics n = 2, 4, 6 … are zero, so these are the first three non-zero terms.)'\n    ] },\n  { t: '8. Sketch: wave and approximation', mode: 'approx', label: 'Watch the Fourier sum approach the square wave as terms are added',\n    lines: [\n      'Blue: the original square wave.',\n      'Orange: the Fourier partial sum, which gets closer as more terms are added.',\n      'Number of terms N is shown on the graph (highest harmonic = 2N − 1).'\n    ] },\n  { t: '9. Why more harmonics help', mode: 'approx', label: 'Sharper edges, flatter tops, but a ≈9% overshoot (Gibbs) stays near the jumps',\n    lines: [\n      'Each new harmonic adds a finer sine wave that corrects the error left by the earlier terms.',\n      'The coefficients fall as 1/n, so high harmonics add only small, fine detail.',\n      '<b>Flat tops:<\/b> the ripples cancel more and more, so the approximation hugs ±1.',\n      '<b>Sharp edges:<\/b> the rise at the jump gets steeper because high-frequency terms are included.',\n      '<b>Gibbs phenomenon:<\/b> a ≈9% overshoot remains next to each jump, but it becomes narrower as N grows.'\n    ] },\n  { t: '10. Physical meaning of each harmonic', mode: 'harm', label: 'Each harmonic is a pure sine wave with its own frequency and amplitude',\n    lines: [\n      '<b>Fundamental (n = 1):<\/b> same period as the square wave, largest amplitude 4/π ≈ 1.273. It gives the basic shape.',\n      '<b>3rd harmonic (n = 3):<\/b> 3× the frequency, amplitude 4/(3π) ≈ 0.424. It steepens the edges and flattens the top.',\n      '<b>5th harmonic (n = 5):<\/b> 5× the frequency, amplitude 4/(5π) ≈ 0.255. It adds finer detail.',\n      '<b>No DC term<\/b> (a₀ = 0): average voltage is zero. <b>No cosine terms<\/b>: the wave is odd. <b>No even harmonics<\/b>: the wave has half-wave symmetry.',\n      'In electronics, a square-wave voltage is a sum of sine voltages. A low-pass filter that removes the higher harmonics rounds the corners.'\n    ] },\n  { t: '11. Bonus: approximation at x = π/4', mode: 'bonus', label: 'Using 3 harmonics at x = π/4 gives about 1.020 (exact f = 1)',\n    lines: [\n      'sin(π/4) = 0.7071, &nbsp; sin(3π/4) = 0.7071, &nbsp; sin(5π/4) = −0.7071',\n      'Term 1: 1.2732 × 0.7071 = 0.9003',\n      'Term 2: 0.4244 × 0.7071 = 0.3001',\n      'Term 3: 0.2546 × (−0.7071) = −0.1801',\n      '<div class=\"hl res\">f(π/4) ≈ 0.9003 + 0.3001 − 0.1801 = 1.0203 ≈ 1.020<\/div>',\n      'Exact value: f(π/4) = 1, so the error is only about 2%.'\n    ] }\n];\n\nlet cur = 0, t0 = performance.now(), autoOn = false, autoTimer = null, lineTimers = [];\nconst cv = document.getElementById('cv'), ctx = cv.getContext('2d');\nconst W = cv.width, H = cv.height;\nconst X = x => 40 + (x + 2 * PI) / (4 * PI) * (W - 70);\nconst Y = y => H / 2 - y * 100;\n\nfunction showStep(i) {\n  cur = i; t0 = performance.now();\n  const s = steps[i];\n  document.getElementById('stepTitle').textContent = s.t;\n  document.getElementById('stepBody').innerHTML = s.lines.map(l => `<div class=\"line\">${l}<\/div>`).join('');\n  document.getElementById('label').textContent = s.label;\n  lineTimers.forEach(clearTimeout); lineTimers = [];\n  document.querySelectorAll('.line').forEach((el, k) => lineTimers.push(setTimeout(() => el.classList.add('show'), 500 + k * 1300)));\n  document.getElementById('prev').disabled = i === 0;\n  document.getElementById('next').disabled = i === steps.length - 1;\n  document.querySelectorAll('.dot').forEach((d, k) => d.classList.toggle('on', k === i));\n  clearTimeout(autoTimer);\n  if (autoOn && i < steps.length - 1) autoTimer = setTimeout(() => showStep(i + 1), 1500 * s.lines.length + 4500);\n}\nfunction go(d) { const n = cur + d; if (n >= 0 && n < steps.length) showStep(n); }\nfunction toggleAuto() {\n  autoOn = !autoOn;\n  document.getElementById('auto').textContent = autoOn ? '⏸ Stop auto' : '▶ Auto-play';\n  showStep(cur);\n}\nconst dots = document.getElementById('dots');\nsteps.forEach((_, i) => { const d = document.createElement('span'); d.className = 'dot'; d.onclick = () => showStep(i); dots.appendChild(d); });\n\nfunction partial(x, N) { let s = 0; for (let j = 0; j < N; j++) { const n = 2 * j + 1; s += 4 / (PI * n) * Math.sin(n * x); } return s; }\nfunction harm(x, n) { return 4 / (PI * n) * Math.sin(n * x); }\n\nfunction axes() {\n  ctx.clearRect(0, 0, W, H);\n  ctx.strokeStyle = '#2b3f5c'; ctx.lineWidth = 1; ctx.fillStyle = '#9fb3cc'; ctx.font = '13px Arial'; ctx.textAlign = 'center';\n  const names = { '-2': '−2π', '-1': '−π', '0': '0', '1': 'π', '2': '2π' };\n  for (let k = -2; k <= 2; k++) {\n    ctx.beginPath(); ctx.moveTo(X(k * PI), 15); ctx.lineTo(X(k * PI), H - 25); ctx.stroke();\n    ctx.fillText(names[k], X(k * PI), H - 8);\n  }\n  [-1, 1].forEach(v => { ctx.beginPath(); ctx.moveTo(35, Y(v)); ctx.lineTo(W - 25, Y(v)); ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]); ctx.fillText(v, 20, Y(v) + 4); });\n  ctx.strokeStyle = '#8aa'; ctx.lineWidth = 1.5;\n  ctx.beginPath(); ctx.moveTo(35, Y(0)); ctx.lineTo(W - 25, Y(0)); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(X(0), 15); ctx.lineTo(X(0), H - 25); ctx.stroke();\n  ctx.fillText('x', W - 15, Y(0) - 6);\n}\nfunction drawSquare(reveal = 1, color = '#4fc3f7', width = 3) {\n  const lim = -2 * PI + reveal * 4 * PI;\n  ctx.strokeStyle = color; ctx.lineWidth = width;\n  for (let k = -2; k < 2; k++) {\n    const a = k * PI, b = (k + 1) * PI, v = (k % 2 === 0) ? 1 : -1;\n    if (lim <= a) break;\n    ctx.beginPath(); ctx.moveTo(X(a), Y(v)); ctx.lineTo(X(Math.min(b, lim)), Y(v)); ctx.stroke();\n    if (lim > b) { ctx.setLineDash([3, 4]); ctx.beginPath(); ctx.moveTo(X(b), Y(v)); ctx.lineTo(X(b), Y(-v)); ctx.stroke(); ctx.setLineDash([]); }\n  }\n}\nfunction curve(fn, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n  ctx.beginPath();\n  for (let i = 0; i <= 700; i++) { const x = -2 * PI + i / 700 * 4 * PI; i ? ctx.lineTo(X(x), Y(fn(x))) : ctx.moveTo(X(x), Y(fn(x))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction text(s, x, y, color = '#fff', size = 16, align = 'left') { ctx.fillStyle = color; ctx.font = `bold ${size}px Arial`; ctx.textAlign = align; ctx.fillText(s, x, y); }\nfunction dot(x, y, color, r = 7) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r, 0, 2 * PI); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }\n\nfunction frame(now) {\n  const t = (now - t0) / 1000, mode = steps[cur].mode;\n  axes();\n  if (mode === 'square') {\n    drawSquare(Math.min(1, t / 3));\n    text('f(x)', X(PI / 2), Y(1) - 10, '#4fc3f7', 15, 'center');\n  } else if (mode === 'odd') {\n    drawSquare(1);\n    const x0 = 0.5 + (Math.sin(t * 1.2) + 1) / 2 * 2.1;\n    ctx.strokeStyle = '#ffffff55'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);\n    ctx.beginPath(); ctx.moveTo(X(x0), Y(1)); ctx.lineTo(X(-x0), Y(-1)); ctx.stroke(); ctx.setLineDash([]);\n    dot(x0, 1, '#4fc3f7'); dot(-x0, -1, '#ffb74d');\n    text('P(x, f(x)) = (x, 1)', X(x0) + 10, Y(1) - 12, '#4fc3f7', 13);\n    text('Q(−x, f(−x)) = (−x, −1)', X(-x0) - 10, Y(-1) + 22, '#ffb74d', 13, 'right');\n    text('f(−x) = −f(x)  → ODD', X(0), 32, '#b9f6ca', 18, 'center');\n  } else if (mode === 'harm') {\n    const c = Math.min(3, Math.floor(t / 2.5) + 1), cols = ['#a5d6a7', '#ce93d8', '#ef9a9a'];\n    drawSquare(1, '#4fc3f755', 2);\n    for (let k = 0; k < c; k++) curve(x => harm(x, 2 * k + 1), cols[k], 1.6, [6, 4]);\n    curve(x => partial(x, c), '#ffb74d', 3.5);\n    ['(4/π) sin x', '(4/3π) sin 3x', '(4/5π) sin 5x'].forEach((s, k) => { if (k < c) text(s, 50, 34 + k * 20, cols[k], 14); });\n    text('Sum of ' + c + ' harmonic' + (c > 1 ? 's' : ''), W - 30, 34, '#ffb74d', 16, 'right');\n  } else if (mode === 'approx') {\n    const seq = [1, 2, 3, 4, 5, 7, 10, 15, 25, 50], N = seq[Math.floor(t / 1.8) % seq.length];\n    drawSquare(1, '#4fc3f7', 2.5);\n    curve(x => partial(x, N), '#ffb74d', 3);\n    text('N = ' + N + ' term' + (N > 1 ? 's' : '') + '  (highest harmonic n = ' + (2 * N - 1) + ')', X(0), 30, '#ffb74d', 17, 'center');\n    if (N >= 10) text('Gibbs overshoot ≈ 9% near the jump', X(0), Y(1.45), '#ff8a80', 14, 'center');\n  } else if (mode === 'bonus') {\n    drawSquare(1, '#4fc3f7', 2.5);\n    curve(x => partial(x, 3), '#ffb74d', 3);\n    const xp = Math.min(PI / 4, t * 0.5);\n    ctx.strokeStyle = '#ffffffaa'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);\n    ctx.beginPath(); ctx.moveTo(X(xp), 15); ctx.lineTo(X(xp), H - 25); ctx.stroke(); ctx.setLineDash([]);\n    dot(xp, partial(xp, 3), '#ffb74d');\n    if (xp >= PI / 4) {\n      dot(PI / 4, 1, '#4fc3f7', 5);\n      text('x = π/4', X(PI / 4), H - 30, '#fff', 14, 'center');\n      text('approx ≈ 1.020', X(PI / 4) + 14, Y(1.02) - 20, '#ffb74d', 14);\n      text('exact = 1', X(PI / 4) + 14, Y(1) + 28, '#4fc3f7', 14);\n    } else text('x = ' + xp.toFixed(2), X(xp), H - 30, '#fff', 14, 'center');\n  }\n  requestAnimationFrame(frame);\n}\nshowStep(0);\nrequestAnimationFrame(frame);\n<\/script>\n<\/body>\n<\/html>"}, {"label": "🔌 Matrices: DC Circuit", "file": "_matrix.html", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Matrices & Determinants – Solving a DC Circuit<\/title>\n<style>\n  * { box-sizing: border-box; }\n  body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg,#0f2027,#203a43,#2c5364); color: #fff; }\n  header { text-align: center; padding: .6rem; }\n  header h1 { margin: 0; font-size: 1.35rem; color: #ffd54f; }\n  header div { font-size: .85rem; opacity: .85; }\n  .main { display: flex; flex-wrap: wrap; gap: 12px; max-width: 1250px; margin: auto; padding: 0 10px; }\n  .text { flex: 1 1 380px; background: rgba(255,255,255,.1); border-radius: 14px; padding: 12px 16px; min-height: 460px; }\n  .text h2 { margin: 0 0 8px; color: #80deea; font-size: 1.2rem; }\n  .line { opacity: 0; transform: translateX(-15px); transition: all .6s; margin: 7px 0; line-height: 1.55; font-size: 1rem; }\n  .line.show { opacity: 1; transform: none; }\n  .hl { background: rgba(255,213,79,.18); border-left: 4px solid #ffd54f; padding: 4px 8px; border-radius: 4px; }\n  .res { color: #b9f6ca; font-weight: bold; }\n  .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 3px; font-size: .95em; }\n  .frac span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px; }\n  .viz { flex: 1 1 600px; background: rgba(0,0,0,.35); border: 2px solid #3b5575; border-radius: 14px; min-height: 460px; padding: 12px; text-align: center; }\n  .vt { color: #ffe082; font-size: 1rem; margin-bottom: 6px; min-height: 1.4rem; }\n  .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; margin: 6px 0; font-size: 1.4rem; }\n  .mat { display: inline-block; border-left: 3px solid #fff; border-right: 3px solid #fff; border-radius: 10px; padding: 4px 6px; margin: 2px 4px; }\n  .mat table { border-collapse: collapse; }\n  .mat td { padding: 5px 11px; font-size: 1.25rem; min-width: 34px; border-radius: 6px; transition: all .5s; }\n  .cap { font-size: .85rem; color: #9fe3ff; margin-top: 2px; }\n  .pop { opacity: 0; animation: popin .5s forwards; animation-delay: var(--d, 0s); }\n  @keyframes popin { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }\n  .pivot { background: #ffd54f; color: #222; transform: scale(1.2); font-weight: bold; }\n  .dead { opacity: .18; }\n  .minor { background: #2e7d32; }\n  .rowhl { background: #1976d2; }\n  .colhl { background: #ef6c00; }\n  .glow { box-shadow: 0 0 14px 4px #ffd54f; }\n  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px auto; max-width: 560px; }\n  .cc { background: rgba(255,255,255,.12); border-radius: 8px; padding: 6px; font-size: .9rem; }\n  .cc b { color: #ffd54f; font-size: 1rem; } .cc .v { color: #b9f6ca; font-weight: bold; font-size: 1.1rem; }\n  .eqs div { font-size: 1.35rem; margin: 6px 0; }\n  .ok { color: #69f0ae; font-weight: bold; }\n  table.cmp { border-collapse: collapse; margin: 8px auto; font-size: 1.05rem; }\n  table.cmp th, table.cmp td { border: 1px solid #5d7a99; padding: 6px 14px; }\n  table.cmp th { background: #1c4b6b; }\n  .detail { font-size: 1rem; color: #ffe082; min-height: 2.6rem; margin-top: 6px; line-height: 1.5; }\n  .controls { text-align: center; margin: 10px 0; }\n  button { background: #ffd54f; color: #222; border: 0; border-radius: 8px; padding: .5rem 1.1rem; font-weight: bold; font-size: 1rem; cursor: pointer; margin: 2px; }\n  button:disabled { opacity: .4; cursor: default; }\n  .dots { text-align: center; margin-bottom: 12px; }\n  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #55708f; margin: 0 3px; cursor: pointer; }\n  .dot.on { background: #ffd54f; transform: scale(1.3); }\n<\/style>\n<\/head>\n<body>\n<header>\n  <h1>⚡ Solving a DC Circuit with Matrices and Determinants<\/h1>\n  <div>Engineering Mathematics · Diploma Engineering · Electrical Engineering application<\/div>\n<\/header>\n\n<div class=\"main\">\n  <div class=\"text\"><h2 id=\"stepTitle\"><\/h2><div id=\"stepBody\"><\/div><\/div>\n  <div class=\"viz\" id=\"viz\"><\/div>\n<\/div>\n\n<div class=\"controls\">\n  <button id=\"prev\" onclick=\"go(-1)\">⏮ Back<\/button>\n  <button id=\"auto\" onclick=\"toggleAuto()\">▶ Auto-play<\/button>\n  <button id=\"next\" onclick=\"go(1)\">Next ⏭<\/button>\n<\/div>\n<div class=\"dots\" id=\"dots\"><\/div>\n\n<script>\nconst $ = id => document.getElementById(id);\nconst fr = (n, d) => `<span class=\"frac\"><span>${n}<\/span><span>${d}<\/span><\/span>`;\nconst A = [[2,1,1],[1,3,2],[1,2,4]], Bv = [10,18,22];\nconst INV = [[8,-2,-1],[-2,7,-3],[-1,-3,5]], SOL = [22,40,46];\nlet timers = [];\nconst later = (f, ms) => timers.push(setTimeout(f, ms));\n\nfunction mat(rows, id, o = {}) {\n  const d0 = o.d || 0, hc = o.col === undefined ? -1 : o.col;\n  return `<div class=\"mat\"><table>${rows.map((r, i) => `<tr>${r.map((c, j) =>\n    `<td id=\"${id}_${i}_${j}\" class=\"pop ${j === hc ? 'colhl' : ''}\" style=\"--d:${d0 + (i * r.length + j) * 0.07}s\">${c}<\/td>`).join('')}<\/tr>`).join('')}<\/table><\/div>`;\n}\nconst cell = (id, i, j) => $(`${id}_${i}_${j}`);\nconst eqLine = (a, b, c, r, d) => `<div class=\"pop\" style=\"--d:${d}s\">${a}I₁ + ${b}I₂ + ${c}I₃ = ${r}<\/div>`;\nconst XV = [['I₁'], ['I₂'], ['I₃']];\n\nconst steps = [\n  { t: '1. The circuit problem',\n    lines: [\n      'Applying <b>Kirchhoff’s Voltage Law<\/b> to three loops gives three simultaneous equations in the unknown currents I₁, I₂, I₃ (in amperes).',\n      '2I₁ + I₂ + I₃ = 10 <br>I₁ + 3I₂ + 2I₃ = 18 <br>I₁ + 2I₂ + 4I₃ = 22',\n      'Goal: find I₁, I₂, I₃ using <b>matrix methods<\/b>, then check with <b>Cramer’s Rule<\/b>.'\n    ],\n    viz: () => `<div class=\"vt\">KVL equations (volts)<\/div><div class=\"eqs\">${eqLine(2,1,1,10,0.2)}${eqLine(1,3,2,18,1.0)}${eqLine(1,2,4,22,1.8)}<\/div>\n      <div class=\"cap pop\" style=\"--d:2.6s\">⚡ 3 loops → 3 equations → 3 unknown currents<\/div>` },\n\n  { t: '2. Matrix form AX = B',\n    lines: [\n      'Collect the coefficients of I₁, I₂, I₃ in <b>A<\/b>, the unknowns in <b>X<\/b> and the right-hand sides in <b>B<\/b>.',\n      '<div class=\"hl res\">AX = B<\/div>',\n      'Row 1 of A × X reproduces 2I₁ + I₂ + I₃ = 10, and so on for rows 2 and 3.'\n    ],\n    viz: () => `<div class=\"vt\">The equations become one matrix equation<\/div>\n      <div class=\"row\">${mat(A, 'a', { d: .2 })}<span>×<\/span>${mat(XV, 'x', { d: 2 })}<span>=<\/span>${mat(Bv.map(v => [v]), 'b', { d: 2.8 })}<\/div>` },\n\n  { t: '3. Identify the three matrices',\n    lines: [\n      '<b>Coefficient matrix A<\/b> (3 × 3): the numbers multiplying the currents.',\n      '<b>Variable matrix X<\/b> (3 × 1): the unknown currents.',\n      '<b>Constant matrix B<\/b> (3 × 1): the source voltages on the right-hand side.'\n    ],\n    viz: () => `<div class=\"vt\">Watch each matrix light up<\/div>\n      <div class=\"row\"><div id=\"wa\">${mat(A, 'a')}<div class=\"cap\">A: coefficient matrix<\/div><\/div><span>×<\/span>\n      <div id=\"wx\">${mat(XV, 'x')}<div class=\"cap\">X: variable matrix<\/div><\/div><span>=<\/span>\n      <div id=\"wb\">${mat(Bv.map(v => [v]), 'b')}<div class=\"cap\">B: constant matrix<\/div><\/div><\/div>`,\n    after: () => { ['wa', 'wx', 'wb'].forEach((id, k) => { later(() => { ['wa','wx','wb'].forEach(o => $(o).classList.remove('glow')); $(id).classList.add('glow'); $(id).style.borderRadius = '12px'; }, 900 + k * 1800); }); } },\n\n  { t: '4. Determinant of A',\n    lines: [\n      'Expand along row 1: |A| = a₁₁(a₂₂a₃₃ − a₂₃a₃₂) − a₁₂(a₂₁a₃₃ − a₂₃a₃₁) + a₁₃(a₂₁a₃₂ − a₂₂a₃₁)',\n      '|A| = 2(3×4 − 2×2) − 1(1×4 − 2×1) + 1(1×2 − 3×1)',\n      '|A| = 2(8) − 1(2) + 1(−1) = 16 − 2 − 1',\n      '<div class=\"hl res\">|A| = 13<\/div>'\n    ],\n    viz: () => `<div class=\"vt\">Yellow = pivot · faded = deleted row and column · green = 2×2 minor<\/div>\n      <div class=\"row\">${mat(A, 'd')}<\/div><div class=\"detail\" id=\"dout\"><\/div>`,\n    after: () => {\n      const minors = [['3×4 − 2×2', 8, '+', 2, 16], ['1×4 − 2×1', 2, '−', 1, -2], ['1×2 − 3×1', -1, '+', 1, -1]];\n      const acc = [];\n      function expand(j) {\n        for (let i = 0; i < 3; i++) for (let k = 0; k < 3; k++) {\n          const el = cell('d', i, k);\n          el.className = (i === 0 && k === j) ? 'pivot' : ((i === 0 || k === j) ? 'dead' : 'minor');\n        }\n        const m = minors[j];\n        acc.push(`${m[2]}${m[3]} × (${m[0]}) = ${m[4]}`);\n        $('dout').innerHTML = acc.join('<br>');\n      }\n      [0, 1, 2].forEach(j => later(() => expand(j), 1500 + j * 2600));\n      later(() => { for (let i = 0; i < 3; i++) for (let k = 0; k < 3; k++) cell('d', i, k).className = ''; $('dout').innerHTML = acc.join('<br>') + '<br><span class=\"res\">|A| = 16 − 2 − 1 = 13<\/span>'; }, 1500 + 3 * 2600);\n    } },\n\n  { t: '5. Does A⁻¹ exist?',\n    lines: [\n      'A square matrix has an inverse only if its determinant is <b>not zero<\/b> (non-singular).',\n      '|A| = 13 ≠ 0',\n      '<div class=\"hl res\">A is non-singular, so A⁻¹ exists and the system has a unique solution.<\/div>'\n    ],\n    viz: () => `<div class=\"vt\">Invertibility test<\/div>\n      <div class=\"row pop\" style=\"--d:.3s;font-size:3rem\">|A| = <span class=\"res\">13<\/span><\/div>\n      <div class=\"row pop\" style=\"--d:1.2s;font-size:2.4rem\">13 ≠ 0 <span class=\"ok\">✔<\/span><\/div>\n      <div class=\"row pop\" style=\"--d:2s\">A⁻¹ exists → unique currents I₁, I₂, I₃<\/div>` },\n\n  { t: '6. Inverse of A',\n    lines: [\n      'A⁻¹ = ' + fr('adj A', '|A|') + ', where adj A is the transpose of the cofactor matrix.',\n      'Cofactor C<sub>ij<\/sub> = (−1)<sup>i+j<\/sup> × (minor M<sub>ij<\/sub>). The nine cofactors are shown on the right.',\n      'Cofactor matrix = [[8, −2, −1], [−2, 7, −3], [−1, −3, 5]]. It is symmetric, so adj A = its transpose = the same matrix.',\n      '<div class=\"hl res\">A⁻¹ = ' + fr(1, 13) + ' [[8, −2, −1], [−2, 7, −3], [−1, −3, 5]]<\/div>'\n    ],\n    viz: () => {\n      const C = [['C₁₁', '+(3×4 − 2×2)', 8], ['C₁₂', '−(1×4 − 2×1)', -2], ['C₁₃', '+(1×2 − 3×1)', -1],\n                 ['C₂₁', '−(1×4 − 1×2)', -2], ['C₂₂', '+(2×4 − 1×1)', 7], ['C₂₃', '−(2×2 − 1×1)', -3],\n                 ['C₃₁', '+(1×2 − 1×3)', -1], ['C₃₂', '−(2×2 − 1×1)', -3], ['C₃₃', '+(2×3 − 1×1)', 5]];\n      return `<div class=\"vt\">Cofactors<\/div><div class=\"grid3\">${C.map((c, k) =>\n        `<div class=\"cc pop\" style=\"--d:${0.3 + k * 0.45}s\"><b>${c[0]}<\/b><br>${c[1]}<br><span class=\"v\">= ${c[2]}<\/span><\/div>`).join('')}<\/div>\n        <div id=\"inv2\"><\/div>`;\n    },\n    after: () => {\n      later(() => { $('inv2').innerHTML = `<div class=\"row\"><span>Cofactor matrix<\/span>${mat(INV, 'c')}<\/div>`; }, 4800);\n      later(() => { $('inv2').innerHTML = `<div class=\"row\"><span>adj A = Cᵀ<\/span>${mat(INV, 'c')}<span>(symmetric)<\/span><\/div>`; }, 7400);\n      later(() => { $('inv2').innerHTML = `<div class=\"row\"><span>A⁻¹ =<\/span><span>${fr(1, 13)}<\/span>${mat(INV, 'c')}<\/div>`; }, 10000);\n    } },\n\n  { t: '7. Solve X = A⁻¹B',\n    lines: [\n      'Multiply A⁻¹ by B, row by row:',\n      'I₁ = (8×10 − 2×18 − 1×22)/13 = (80 − 36 − 22)/13 = 22/13',\n      'I₂ = (−2×10 + 7×18 − 3×22)/13 = (−20 + 126 − 66)/13 = 40/13',\n      'I₃ = (−1×10 − 3×18 + 5×22)/13 = (−10 − 54 + 110)/13 = 46/13',\n      '<div class=\"hl res\">I₁ ≈ 1.692 A, I₂ ≈ 3.077 A, I₃ ≈ 3.538 A<\/div>'\n    ],\n    viz: () => `<div class=\"vt\">X = A⁻¹B (row × column)<\/div>\n      <div class=\"row\">${mat([['I₁'], ['I₂'], ['I₃']], 'r', { d: 0 })}<span>=<\/span><span>${fr(1, 13)}<\/span>${mat(INV, 'iv', { d: .2 })}${mat(Bv.map(v => [v]), 'bb', { d: .6 })}<\/div>\n      <div class=\"detail\" id=\"mout\"><\/div>`,\n    after: () => {\n      const names = ['I₁', 'I₂', 'I₃'];\n      [0, 1, 2].forEach(i => later(() => {\n        for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) cell('iv', r, c).className = r === i ? 'rowhl' : '';\n        for (let r = 0; r < 3; r++) cell('bb', r, 0).className = 'colhl';\n        const row = INV[i];\n        $('mout').innerHTML = `Row ${i + 1}: ${row[0]}×10 + (${row[1]})×18 + (${row[2]})×22 = ${SOL[i]}  →  ${names[i]} = ${SOL[i]}/13 ≈ ${(SOL[i] / 13).toFixed(3)} A`;\n        const t = cell('r', i, 0); t.className = 'pivot'; t.innerHTML = `${SOL[i]}/13`;\n      }, 1800 + i * 3000));\n      later(() => { for (let r = 0; r < 3; r++) { for (let c = 0; c < 3; c++) cell('iv', r, c).className = ''; cell('bb', r, 0).className = ''; } $('mout').innerHTML = '<span class=\"res\">I₁ = 22/13 ≈ 1.692 A, I₂ = 40/13 ≈ 3.077 A, I₃ = 46/13 ≈ 3.538 A<\/span>'; }, 1800 + 3 * 3000);\n    } },\n\n  { t: '8. Verify in the original equations',\n    lines: [\n      'Substitute I₁ = 22/13, I₂ = 40/13, I₃ = 46/13:',\n      'Eq. 1: 2(22) + 40 + 46 = 130, and 130/13 = 10 ✔',\n      'Eq. 2: 22 + 3(40) + 2(46) = 234, and 234/13 = 18 ✔',\n      'Eq. 3: 22 + 2(40) + 4(46) = 286, and 286/13 = 22 ✔',\n      '<div class=\"hl res\">All three equations are satisfied.<\/div>'\n    ],\n    viz: () => `<div class=\"vt\">Checking each equation<\/div><div class=\"eqs\">\n      <div class=\"pop\" style=\"--d:.3s\">2(${fr(22, 13)}) + ${fr(40, 13)} + ${fr(46, 13)} = ${fr(130, 13)} = 10 <span class=\"ok pop\" style=\"--d:1.2s\">✔<\/span><\/div>\n      <div class=\"pop\" style=\"--d:2s\">${fr(22, 13)} + 3(${fr(40, 13)}) + 2(${fr(46, 13)}) = ${fr(234, 13)} = 18 <span class=\"ok pop\" style=\"--d:2.9s\">✔<\/span><\/div>\n      <div class=\"pop\" style=\"--d:3.7s\">${fr(22, 13)} + 2(${fr(40, 13)}) + 4(${fr(46, 13)}) = ${fr(286, 13)} = 22 <span class=\"ok pop\" style=\"--d:4.6s\">✔<\/span><\/div><\/div>` },\n\n  { t: '9. Cramer’s Rule',\n    lines: [\n      'I<sub>k<\/sub> = D<sub>k<\/sub> / D, where D<sub>k<\/sub> is |A| with column k replaced by B. D = |A| = 13.',\n      'D₁ = 10(12 − 4) − 1(72 − 44) + 1(36 − 66) = 80 − 28 − 30 = 22',\n      'D₂ = 2(72 − 44) − 10(4 − 2) + 1(22 − 18) = 56 − 20 + 4 = 40',\n      'D₃ = 2(66 − 36) − 1(22 − 18) + 10(2 − 3) = 60 − 4 − 10 = 46',\n      '<div class=\"hl res\">I₁ = 22/13, I₂ = 40/13, I₃ = 46/13<\/div>'\n    ],\n    viz: () => {\n      const D1 = [[10,1,1],[18,3,2],[22,2,4]], D2 = [[2,10,1],[1,18,2],[1,22,4]], D3 = [[2,1,10],[1,3,18],[1,2,22]];\n      const blk = (T, m, col, v, I, n, d) => `<div class=\"pop\" style=\"--d:${d}s\">${T}${mat(m, 'k' + n, { col, d })}<div class=\"res\">${T.replace(/ /g,'')} = ${v}<\/div><div class=\"cap\">${I} = ${v}/13 ≈ ${(v / 13).toFixed(3)} A<\/div><\/div>`;\n      return `<div class=\"vt\">Orange column = B replaces that column of A<\/div>\n        <div class=\"row\" style=\"align-items:flex-start\">${blk('D₁ ', D1, 0, 22, 'I₁', 1, 0.3)}${blk('D₂ ', D2, 1, 40, 'I₂', 2, 2.2)}${blk('D₃ ', D3, 2, 46, 'I₃', 3, 4.1)}<\/div>\n        <div class=\"row pop\" style=\"--d:6s;font-size:1.1rem\">D = 13 → I = D<sub>k<\/sub> / 13<\/div>`;\n    } },\n\n  { t: '10. Compare both methods',\n    lines: [\n      'Matrix inversion and Cramer’s Rule give <b>identical<\/b> currents.',\n      'Matrix inversion: compute A⁻¹ once, then reuse it for any new B (different source voltages).',\n      'Cramer’s Rule: only needs determinants, which is quick for 2×2 or 3×3 systems, but heavy for larger ones.',\n      '<div class=\"hl res\">Both methods agree, so the answer is verified.<\/div>'\n    ],\n    viz: () => `<div class=\"vt\">Results side by side<\/div>\n      <table class=\"cmp pop\" style=\"--d:.3s\"><tr><th>Method<\/th><th>I₁ (A)<\/th><th>I₂ (A)<\/th><th>I₃ (A)<\/th><\/tr>\n      <tr class=\"pop\" style=\"--d:1s\"><td>Matrix inversion<\/td><td>22/13 ≈ 1.692<\/td><td>40/13 ≈ 3.077<\/td><td>46/13 ≈ 3.538<\/td><\/tr>\n      <tr class=\"pop\" style=\"--d:2s\"><td>Cramer’s Rule<\/td><td>22/13 ≈ 1.692<\/td><td>40/13 ≈ 3.077<\/td><td>46/13 ≈ 3.538<\/td><\/tr><\/table>\n      <div class=\"row pop ok\" style=\"--d:3s;font-size:2rem\">✔ Results match<\/div>` },\n\n  { t: '11. Bonus: what if |A| = 0?',\n    lines: [\n      'If |A| = 0, A is <b>singular<\/b>: A⁻¹ does not exist, and Cramer’s Rule fails because it divides by |A| = 0.',\n      'Then the system has <b>either no solution or infinitely many solutions<\/b>.',\n      'Example: if row 3 = row 1 + row 2, then |A| = 0. If B follows the same pattern (10 + 18 = 28) there are infinitely many solutions. If not (e.g. 30), the equations contradict each other: no solution.',\n      '<i>Physical meaning:<\/i> the loop equations are not independent, so the currents cannot be fixed uniquely. Check the circuit model or the measured values.'\n    ],\n    viz: () => `<div class=\"vt\">A singular example: row 3 = row 1 + row 2<\/div>\n      <div class=\"row\">${mat([[2,1,1],[1,3,2],[3,4,3]], 's')}<\/div>\n      <div class=\"detail\" id=\"sout\">|A| = 2(9 − 8) − 1(3 − 6) + 1(4 − 9) = 2 + 3 − 5 = 0<\/div>\n      <div class=\"row pop\" style=\"--d:3s;font-size:1.05rem\">|A| = 0 ⇒ no A⁻¹ ⇒ Cramer’s Rule: I = D<sub>k<\/sub> / 0 (undefined)<\/div>\n      <div class=\"row pop\" style=\"--d:4.5s;font-size:1.05rem\">D<sub>k<\/sub> all 0 ⇒ infinitely many solutions &nbsp;|&nbsp; some D<sub>k<\/sub> ≠ 0 ⇒ no solution<\/div>`,\n    after: () => {\n      later(() => { for (let j = 0; j < 3; j++) cell('s', 2, j).className = 'rowhl'; }, 1200);\n      later(() => { for (let j = 0; j < 3; j++) { cell('s', 0, j).className = 'colhl'; cell('s', 1, j).className = 'colhl'; } }, 2200);\n    } }\n];\n\nlet cur = 0, autoOn = false, autoTimer = null, lineTimers = [];\nfunction showStep(i) {\n  cur = i;\n  timers.forEach(clearTimeout); timers = [];\n  lineTimers.forEach(clearTimeout); lineTimers = [];\n  clearTimeout(autoTimer);\n  const s = steps[i];\n  $('stepTitle').textContent = s.t;\n  $('stepBody').innerHTML = s.lines.map(l => `<div class=\"line\">${l}<\/div>`).join('');\n  $('viz').innerHTML = s.viz();\n  if (s.after) s.after();\n  document.querySelectorAll('.line').forEach((el, k) => lineTimers.push(setTimeout(() => el.classList.add('show'), 400 + k * 1400)));\n  $('prev').disabled = i === 0; $('next').disabled = i === steps.length - 1;\n  document.querySelectorAll('.dot').forEach((d, k) => d.classList.toggle('on', k === i));\n  if (autoOn && i < steps.length - 1) autoTimer = setTimeout(() => showStep(i + 1), (i === 3 || i === 5 || i === 6 ? 13000 : 9500) + s.lines.length * 600);\n}\nfunction go(d) { const n = cur + d; if (n >= 0 && n < steps.length) showStep(n); }\nfunction toggleAuto() { autoOn = !autoOn; $('auto').textContent = autoOn ? '⏸ Stop auto' : '▶ Auto-play'; showStep(cur); }\nsteps.forEach((_, i) => { const d = document.createElement('span'); d.className = 'dot'; d.onclick = () => showStep(i); $('dots').appendChild(d); });\nshowStep(0);\n<\/script>\n<\/body>\n<\/html>"}, {"label": "🏙️ Matrices: Traffic (A)", "file": "_matrix2.html", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Smart City Traffic Management Using Matrices<\/title>\n<style>\n  * { box-sizing: border-box; }\n  body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg,#10233a,#1b4965,#0b3d3a); color: #fff; }\n  header { text-align: center; padding: .6rem; }\n  header h1 { margin: 0; font-size: 1.35rem; color: #ffd54f; }\n  header div { font-size: .85rem; opacity: .85; }\n  .main { display: flex; flex-wrap: wrap; gap: 12px; max-width: 1280px; margin: auto; padding: 0 10px; }\n  .text { flex: 1 1 360px; background: rgba(255,255,255,.1); border-radius: 14px; padding: 12px 16px; min-height: 480px; }\n  .text h2 { margin: 0 0 8px; color: #80deea; font-size: 1.2rem; }\n  .line { opacity: 0; transform: translateX(-15px); transition: all .6s; margin: 7px 0; line-height: 1.55; font-size: 1rem; }\n  .line.show { opacity: 1; transform: none; }\n  .hl { background: rgba(255,213,79,.18); border-left: 4px solid #ffd54f; padding: 4px 8px; border-radius: 4px; }\n  .res { color: #b9f6ca; font-weight: bold; }\n  .viz { flex: 1 1 640px; background: rgba(0,0,0,.35); border: 2px solid #3b5575; border-radius: 14px; min-height: 480px; padding: 10px; text-align: center; }\n  .vt { color: #ffe082; font-size: 1rem; margin-bottom: 4px; min-height: 1.3rem; }\n  .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; margin: 6px 0; }\n  .op { font-size: 1.8rem; font-weight: bold; }\n  table.gm { border-collapse: collapse; margin: 2px; }\n  table.gm th { color: #80deea; font-size: .85rem; padding: 4px 8px; }\n  table.gm th.xh { color: #ffd54f; }\n  table.gm td { border: 1px solid #55708f; padding: 6px 10px; min-width: 46px; font-size: 1.05rem; transition: all .5s; border-radius: 4px; }\n  table.gm td.xc, table.gm td.xr { color: #ffd54f; font-weight: bold; border-color: #ffd54f55; }\n  table.sm td { padding: 4px 7px; min-width: 36px; font-size: .85rem; }\n  table.sm th { font-size: .75rem; padding: 3px 6px; }\n  .cap { font-size: .85rem; color: #9fe3ff; margin-top: 2px; }\n  .pop { opacity: 0; animation: popin .5s forwards; animation-delay: var(--d, 0s); }\n  @keyframes popin { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }\n  .pivot { background: #ffd54f; color: #222; font-weight: bold; }\n  .rowhl { background: #1976d2; }\n  .colhl { background: #ef6c00; }\n  .minor { background: #2e7d32; }\n  .detail { font-size: 1rem; color: #ffe082; min-height: 2.8rem; margin-top: 6px; line-height: 1.5; }\n  svg.net { width: 100%; max-width: 400px; background: rgba(255,255,255,.05); border-radius: 12px; }\n  .ar line { stroke: #4fc3f7; stroke-dasharray: 10 7; animation: flow 1s linear infinite; transition: opacity .4s; }\n  .ar polygon { fill: #4fc3f7; }\n  .ar text { fill: #fff; font-size: 11px; font-weight: bold; }\n  .ar.dim { opacity: .1; }\n  .ar.hi line { stroke: #ffd54f; } .ar.hi polygon { fill: #ffd54f; } .ar.hi text { fill: #ffd54f; font-size: 13px; }\n  @keyframes flow { to { stroke-dashoffset: -34; } }\n  .nd { fill: #0d47a1; stroke: #fff; stroke-width: 2; transition: all .4s; }\n  .nd.on { fill: #f57c00; }\n  .nt { fill: #fff; font-size: 20px; font-weight: bold; text-anchor: middle; }\n  .bars { text-align: left; max-width: 420px; margin: 8px auto; }\n  .bar { display: flex; align-items: center; gap: 8px; margin: 8px 0; }\n  .bar .lb { width: 24px; font-weight: bold; font-size: 1.1rem; }\n  .bar .fillb { height: 26px; background: linear-gradient(90deg,#4fc3f7,#1976d2); border-radius: 6px; width: 0; transition: width 1.4s; }\n  .bar .fillb.top { background: linear-gradient(90deg,#ffd54f,#ff9800); }\n  .bar .vv { font-weight: bold; }\n  .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 560px; margin: 8px auto; text-align: left; }\n  .card { background: rgba(255,255,255,.12); border-radius: 10px; padding: 8px 10px; font-size: .95rem; line-height: 1.45; }\n  .card b { color: #ffd54f; }\n  .controls { text-align: center; margin: 10px 0; }\n  button { background: #ffd54f; color: #222; border: 0; border-radius: 8px; padding: .5rem 1.1rem; font-weight: bold; font-size: 1rem; cursor: pointer; margin: 2px; }\n  button:disabled { opacity: .4; cursor: default; }\n  .dots { text-align: center; margin-bottom: 12px; }\n  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #55708f; margin: 0 3px; cursor: pointer; }\n  .dot.on { background: #ffd54f; transform: scale(1.3); }\n<\/style>\n<\/head>\n<body>\n<header>\n  <h1>🚦 Smart City Traffic Management Using Matrices<\/h1>\n  <div>Engineering Mathematics · Diploma Engineering · Civil &amp; Transportation Engineering<\/div>\n<\/header>\n\n<div class=\"main\">\n  <div class=\"text\"><h2 id=\"stepTitle\"><\/h2><div id=\"stepBody\"><\/div><\/div>\n  <div class=\"viz\" id=\"viz\"><\/div>\n<\/div>\n\n<div class=\"controls\">\n  <button id=\"prev\" onclick=\"go(-1)\">⏮ Back<\/button>\n  <button id=\"auto\" onclick=\"toggleAuto()\">▶ Auto-play<\/button>\n  <button id=\"next\" onclick=\"go(1)\">Next ⏭<\/button>\n<\/div>\n<div class=\"dots\" id=\"dots\"><\/div>\n\n<script>\nconst $ = id => document.getElementById(id);\nconst N = ['A', 'B', 'C', 'D'];\nconst T = [[0,120,80,60],[100,0,150,90],[70,110,0,130],[50,80,120,0]];\nconst T20 = T.map(r => r.map(v => v * 1.2));\nconst T2 = T.map(r => r.slice()); T2[1][2] = 105;\nconst M = T.map(r => r.slice()); M[0][1] = 150; M[1][2] = 190; M[2][3] = 150; M[3][0] = 60;\nconst DT = M.map((r, i) => r.map((v, j) => v - T[i][j]));\nconst rs = (m, i) => m[i].reduce((a, b) => a + b, 0);\nconst cs = (m, j) => m.reduce((a, r) => a + r[j], 0);\nconst tot = m => m.reduce((a, r) => a + r.reduce((x, y) => x + y, 0), 0);\nconst fmt = v => Number.isInteger(v) ? v : +v.toFixed(1);\nconst OUT = T.map((_, i) => rs(T, i)), IN = N.map((_, j) => cs(T, j));\nlet timers = [];\nconst later = (f, ms) => timers.push(setTimeout(f, ms));\nconst cell = (id, i, j) => $(`${id}_${i}_${j}`);\n\n/* ---------- matrix grid ---------- */\nfunction grid(m, id, o = {}) {\n  const d0 = o.d || 0;\n  let h = `<table class=\"gm ${o.sm ? 'sm' : ''}\"><tr><th><\/th>${N.map(n => `<th>${n}<\/th>`).join('')}${o.xc ? `<th class=\"xh\">${o.xc}<\/th>` : ''}<\/tr>`;\n  m.forEach((r, i) => {\n    h += `<tr><th>${N[i]}<\/th>${r.map((v, j) => `<td id=\"${id}_${i}_${j}\" class=\"pop\" style=\"--d:${d0 + (i * 4 + j) * 0.06}s\">${fmt(v)}<\/td>`).join('')}${o.xc ? `<td id=\"${id}_${i}_c\" class=\"xc\">${o.fill ? fmt(rs(m, i)) : ''}<\/td>` : ''}<\/tr>`;\n  });\n  if (o.xr) h += `<tr><th class=\"xh\">${o.xr}<\/th>${N.map((_, j) => `<td id=\"${id}_r_${j}\" class=\"xr\">${o.fill ? fmt(cs(m, j)) : ''}<\/td>`).join('')}${o.xc ? `<td id=\"${id}_r_c\" class=\"xr\">${o.fill ? fmt(tot(m)) : ''}<\/td>` : ''}<\/tr>`;\n  return h + '<\/table>';\n}\nfunction setExtras(id, m) {\n  N.forEach((_, i) => { $(`${id}_${i}_c`).textContent = fmt(rs(m, i)); $(`${id}_r_${i}`).textContent = fmt(cs(m, i)); });\n  $(`${id}_r_c`).textContent = fmt(tot(m));\n}\n\n/* ---------- road network ---------- */\nconst P = [[70, 70], [330, 70], [330, 260], [70, 260]];\nfunction netSVG(m, id) {\n  let s = `<svg viewBox=\"0 0 400 330\" class=\"net\" id=\"${id}\">`;\n  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {\n    if (i === j || !m[i][j]) continue;\n    const [x1, y1] = P[i], [x2, y2] = P[j], dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);\n    const ux = dx / len, uy = dy / len, px = -uy, py = ux, o = 9;\n    const sx = x1 + ux * 28 + px * o, sy = y1 + uy * 28 + py * o, ex = x2 - ux * 30 + px * o, ey = y2 - uy * 30 + py * o;\n    const b1 = [ex - ux * 11 + px * 5, ey - uy * 11 + py * 5], b2 = [ex - ux * 11 - px * 5, ey - uy * 11 - py * 5];\n    const lx = sx + (ex - sx) * 0.3 + px * 13, ly = sy + (ey - sy) * 0.3 + py * 13 + 4;\n    s += `<g id=\"${id}_${i}_${j}\" class=\"ar\"><line x1=\"${sx}\" y1=\"${sy}\" x2=\"${ex}\" y2=\"${ey}\" stroke-width=\"${1.5 + m[i][j] / 35}\"/>\n      <polygon points=\"${ex},${ey} ${b1[0]},${b1[1]} ${b2[0]},${b2[1]}\"/><text x=\"${lx}\" y=\"${ly}\" text-anchor=\"middle\">${fmt(m[i][j])}<\/text><\/g>`;\n  }\n  N.forEach((n, i) => { s += `<circle id=\"${id}_n${i}\" class=\"nd\" cx=\"${P[i][0]}\" cy=\"${P[i][1]}\" r=\"24\"/><text class=\"nt\" x=\"${P[i][0]}\" y=\"${P[i][1] + 7}\">${n}<\/text>`; });\n  return s + '<\/svg>';\n}\nfunction netMode(id, mode, k) {\n  for (let i = 0; i < 4; i++) {\n    $(`${id}_n${i}`).classList.toggle('on', mode !== 'none' && i === k);\n    for (let j = 0; j < 4; j++) {\n      const g = $(`${id}_${i}_${j}`); if (!g) continue;\n      g.classList.remove('dim', 'hi');\n      if (mode === 'out') g.classList.add(i === k ? 'hi' : 'dim');\n      if (mode === 'in') g.classList.add(j === k ? 'hi' : 'dim');\n    }\n  }\n}\nfunction bars(vals, id, suffix = '') {\n  return `<div class=\"bars\">${vals.map((v, i) => `<div class=\"bar\"><div class=\"lb\">${N[i]}<\/div><div class=\"fillb\" id=\"${id}${i}\"><\/div><div class=\"vv\" id=\"${id}v${i}\"><\/div><\/div>`).join('')}<\/div>`;\n}\nfunction growBars(vals, id, top) {\n  vals.forEach((v, i) => later(() => { const b = $(id + i); b.style.width = (v / 400 * 100) + '%'; $(id + 'v' + i).textContent = v; if (i === top) later(() => b.classList.add('top'), 1500); }, 300 + i * 250));\n}\nconst cellHL = (id, mode, k, cls) => { for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { const e = cell(id, i, j); e.className = ((mode === 'row' && i === k) || (mode === 'col' && j === k)) ? cls : ''; } };\nconst clearHL = id => { for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) cell(id, i, j).className = ''; };\n\n/* ---------- steps ---------- */\nconst steps = [\n  { t: '1. The smart-city traffic network',\n    lines: [\n      'A smart city has four junctions: <b>A, B, C, D<\/b>. A survey counts the vehicles travelling from one junction to another in one hour.',\n      'The animation shows each flow as an arrow. <b>Thicker arrow = more vehicles<\/b>, and the moving dashes show the direction.',\n      'No vehicle travels from a junction to itself, so those flows are 0.',\n      'Goal: use <b>matrices<\/b> to analyse and manage this traffic.'\n    ],\n    viz: () => `<div class=\"vt\">Vehicles per hour between junctions<\/div>${netSVG(T, 'net')}` },\n\n  { t: '2. Traffic data as a matrix',\n    lines: [\n      'Rows = <b>From<\/b> junction, columns = <b>To<\/b> junction. The entry t<sub>ij<\/sub> is the number of vehicles going from junction i to junction j.',\n      'Example: t<sub>23<\/sub> = 150 means 150 vehicles per hour go from B to C.',\n      '<div class=\"hl res\">T is a 4 × 4 square matrix with zeros on the diagonal.<\/div>'\n    ],\n    viz: () => `<div class=\"vt\">Traffic matrix T (From ↓, To →)<\/div><div class=\"row\">${grid(T, 't', { d: .2 })}<\/div>\n      <div class=\"cap pop\" style=\"--d:2s\">T = [[0,120,80,60], [100,0,150,90], [70,110,0,130], [50,80,120,0]]<\/div>` },\n\n  { t: '3. Vehicles leaving each junction',\n    lines: [\n      'Outgoing traffic of a junction = <b>sum of its row<\/b>.',\n      'A: 0 + 120 + 80 + 60 = <span class=\"res\">260<\/span>',\n      'B: 100 + 0 + 150 + 90 = <span class=\"res\">340<\/span>',\n      'C: 70 + 110 + 0 + 130 = <span class=\"res\">310<\/span>',\n      'D: 50 + 80 + 120 + 0 = <span class=\"res\">250<\/span>'\n    ],\n    viz: () => `<div class=\"vt\">Row sums = outgoing traffic<\/div><div class=\"row\">${netSVG(T, 'net')}<div>${grid(T, 'g', { xc: 'Out' })}<\/div><\/div><div class=\"detail\" id=\"dd\"><\/div>`,\n    after: () => {\n      [0, 1, 2, 3].forEach(i => later(() => {\n        cellHL('g', 'row', i, 'rowhl'); netMode('net', 'out', i);\n        $('dd').innerHTML = `Junction ${N[i]}: ${T[i].join(' + ')} = ${OUT[i]}`;\n        const c = $(`g_${i}_c`); c.textContent = OUT[i]; c.classList.add('pivot');\n      }, 1500 + i * 2600));\n      later(() => { clearHL('g'); netMode('net', 'none'); $('dd').innerHTML = '<span class=\"res\">Outgoing: A = 260, B = 340, C = 310, D = 250<\/span>'; }, 1500 + 4 * 2600);\n    } },\n\n  { t: '4. Vehicles entering each junction',\n    lines: [\n      'Incoming traffic of a junction = <b>sum of its column<\/b>.',\n      'A: 0 + 100 + 70 + 50 = <span class=\"res\">220<\/span>',\n      'B: 120 + 0 + 110 + 80 = <span class=\"res\">310<\/span>',\n      'C: 80 + 150 + 0 + 120 = <span class=\"res\">350<\/span>',\n      'D: 60 + 90 + 130 + 0 = <span class=\"res\">280<\/span>'\n    ],\n    viz: () => `<div class=\"vt\">Column sums = incoming traffic<\/div><div class=\"row\">${netSVG(T, 'net')}<div>${grid(T, 'g', { xr: 'In' })}<\/div><\/div><div class=\"detail\" id=\"dd\"><\/div>`,\n    after: () => {\n      [0, 1, 2, 3].forEach(j => later(() => {\n        cellHL('g', 'col', j, 'colhl'); netMode('net', 'in', j);\n        $('dd').innerHTML = `Junction ${N[j]}: ${T.map(r => r[j]).join(' + ')} = ${IN[j]}`;\n        const c = $(`g_r_${j}`); c.textContent = IN[j]; c.classList.add('pivot');\n      }, 1500 + j * 2600));\n      later(() => { clearHL('g'); netMode('net', 'none'); $('dd').innerHTML = '<span class=\"res\">Incoming: A = 220, B = 310, C = 350, D = 280<\/span>'; }, 1500 + 4 * 2600);\n    } },\n\n  { t: '5. Total traffic in the network',\n    lines: [\n      'Total = sum of <b>all entries<\/b> of T = sum of the outgoing totals.',\n      '260 + 340 + 310 + 250 = <span class=\"res\">1160<\/span>',\n      'Check with incoming totals: 220 + 310 + 350 + 280 = 1160 ✔',\n      '<div class=\"hl res\">Total traffic = 1160 vehicles per hour.<\/div>',\n      'Every vehicle that leaves one junction enters another, so the two totals must match.'\n    ],\n    viz: () => `<div class=\"vt\">Row sums and column sums<\/div><div class=\"row\">${grid(T, 'g', { xc: 'Out', xr: 'In', fill: true, d: .2 })}<\/div>\n      <div class=\"row pop\" style=\"--d:2s;font-size:1.3rem\">260 + 340 + 310 + 250 = <span class=\"res\">1160<\/span><\/div>\n      <div class=\"row pop\" style=\"--d:3.2s;font-size:1.3rem\">220 + 310 + 350 + 280 = <span class=\"res\">1160<\/span> ✔<\/div>` },\n\n  { t: '6. Highest outgoing traffic',\n    lines: [\n      'Compare the outgoing totals: A = 260, B = 340, C = 310, D = 250.',\n      '<div class=\"hl res\">Junction B has the highest outgoing traffic: 340 vehicles per hour.<\/div>',\n      'B is the busiest <i>source<\/i>. Engineers may add exit lanes or adjust the signal timing here.'\n    ],\n    viz: () => `<div class=\"vt\">Outgoing traffic per junction<\/div><div class=\"row\">${netSVG(T, 'net')}${bars(OUT, 'bo')}<\/div>`,\n    after: () => { growBars(OUT, 'bo', 1); later(() => netMode('net', 'out', 1), 2200); } },\n\n  { t: '7. Highest incoming traffic',\n    lines: [\n      'Compare the incoming totals: A = 220, B = 310, C = 350, D = 280.',\n      '<div class=\"hl res\">Junction C has the highest incoming traffic: 350 vehicles per hour.<\/div>',\n      'C is the busiest <i>destination<\/i>. It needs enough entry capacity, parking and approach lanes.'\n    ],\n    viz: () => `<div class=\"vt\">Incoming traffic per junction<\/div><div class=\"row\">${netSVG(T, 'net')}${bars(IN, 'bi')}<\/div>`,\n    after: () => { growBars(IN, 'bi', 2); later(() => netMode('net', 'in', 2), 2200); } },\n\n  { t: '8. Traffic increases by 20%',\n    lines: [\n      'Scalar multiplication: multiply <b>every entry<\/b> by 1.2.',\n      'Row A: 0, 120×1.2 = 144, 80×1.2 = 96, 60×1.2 = 72',\n      'Row B: 100×1.2 = 120, 0, 150×1.2 = 180, 90×1.2 = 108',\n      'Row C: 70×1.2 = 84, 110×1.2 = 132, 0, 130×1.2 = 156',\n      'Row D: 50×1.2 = 60, 80×1.2 = 96, 120×1.2 = 144, 0',\n      '<div class=\"hl res\">New total = 1.2 × 1160 = 1392 vehicles per hour.<\/div>'\n    ],\n    viz: () => `<div class=\"vt\">New matrix = 1.2 × T<\/div><div class=\"row\"><span class=\"op\">1.2 ×<\/span>${grid(T, 'g', { xc: 'Out', xr: 'In', fill: true, d: .2 })}<\/div><div class=\"detail\" id=\"dd\">Watch every entry being multiplied by 1.2…<\/div>`,\n    after: () => {\n      for (let k = 0; k < 16; k++) { const i = Math.floor(k / 4), j = k % 4;\n        later(() => { const c = cell('g', i, j); c.textContent = fmt(T20[i][j]); c.className = 'minor'; }, 1500 + k * 170); }\n      later(() => { setExtras('g', T20); $('dd').innerHTML = '<span class=\"res\">New outgoing: A = 312, B = 408, C = 372, D = 300 (total 1392)<\/span>'; }, 1500 + 16 * 170 + 400);\n    } },\n\n  { t: '9. Reduce B → C traffic by 30%',\n    lines: [\n      'Reduction by 30% means multiplying that entry by 0.7. Only t<sub>23<\/sub> (B → C) changes. (Applied to the original matrix T.)',\n      't<sub>23<\/sub> = 150 × 0.7 = <span class=\"res\">105<\/span>',\n      '<div class=\"hl\">Updated row B: [100, 0, 105, 90]<\/div>',\n      'New totals: B out = 295, C in = 305, network total = 1160 − 45 = <span class=\"res\">1115<\/span>.',\n      '<b>Insight:<\/b> C now has the highest outgoing traffic (310) and B has the highest incoming traffic (310).'\n    ],\n    viz: () => `<div class=\"vt\">Only the B → C entry changes<\/div><div class=\"row\">${grid(T, 'g', { xc: 'Out', xr: 'In', fill: true, d: .2 })}<\/div><div class=\"detail\" id=\"dd\"><\/div>`,\n    after: () => {\n      later(() => { cell('g', 1, 2).className = 'pivot'; $('dd').innerHTML = 'Select the B → C entry (150).'; }, 1500);\n      later(() => { cell('g', 1, 2).textContent = '150×0.7'; $('dd').innerHTML = '150 × 0.7 = 105'; }, 3200);\n      later(() => { cell('g', 1, 2).textContent = '105'; setExtras('g', T2); $('dd').innerHTML = '<span class=\"res\">B out = 100 + 0 + 105 + 90 = 295 · C in = 80 + 105 + 0 + 120 = 305 · Total = 1115<\/span>'; }, 4800);\n      later(() => { $('g_2_c').classList.add('colhl'); $('g_r_1').classList.add('colhl'); $('dd').innerHTML += '<br>Highest outgoing is now C (310); highest incoming is now B (310).'; }, 6500);\n    } },\n\n  { t: '10. Advanced: original, modified and difference',\n    lines: [\n      'The new system raises the capacity of four selected roads (assumed values): A→B 120 → 150, B→C 150 → 190, C→D 130 → 150, D→A 50 → 60.',\n      '<b>Modified matrix M<\/b> = original T with those four entries increased.',\n      '<b>Difference ΔT = M − T<\/b> (subtract entry by entry). It is non-zero only on the four upgraded roads: +30, +40, +20, +10.',\n      'Check: T + ΔT = M. Total traffic: 1160 + 100 = <span class=\"res\">1260<\/span>.'\n    ],\n    viz: () => `<div class=\"vt\">Matrix addition and subtraction (orange = upgraded roads)<\/div>\n      <div class=\"row\"><div>${grid(T, 't', { sm: true, d: .2 })}<div class=\"cap\">T (original)<\/div><\/div><span class=\"op\">+<\/span>\n      <div>${grid(DT, 'dl', { sm: true, d: 1.2 })}<div class=\"cap\">ΔT = M − T<\/div><\/div><span class=\"op\">=<\/span>\n      <div>${grid(M, 'mm', { sm: true, d: 2.2 })}<div class=\"cap\">M (modified)<\/div><\/div><\/div>\n      <div class=\"detail pop\" style=\"--d:3.6s\">Total: 1160 + 100 = 1260 vehicles per hour<\/div>`,\n    after: () => { later(() => { [[0,1],[1,2],[2,3],[3,0]].forEach(([i, j]) => ['t', 'dl', 'mm'].forEach(id => cell(id, i, j).className = 'colhl')); }, 4200); } },\n\n  { t: '11. How matrix operations help engineers',\n    lines: [\n      '<b>Addition:<\/b> add matrices from different times or routes (morning + evening = daily traffic) or add planned changes: T + ΔT = M.',\n      '<b>Subtraction:<\/b> M − T shows exactly which roads changed and by how much.',\n      '<b>Scalar multiplication:<\/b> kT models growth (k = 1.2) or reduction (entry × 0.7) in quick what-if tests.',\n      '<b>Row and column sums<\/b> reveal the busiest junctions, so engineers can find bottlenecks before building anything.'\n    ],\n    viz: () => `<div class=\"vt\">Matrices make traffic planning fast and accurate<\/div><div class=\"cards\">\n      <div class=\"card pop\" style=\"--d:.3s\"><b>➕ Matrix addition<\/b><br>Combine data from different periods or add planned changes.<\/div>\n      <div class=\"card pop\" style=\"--d:1.2s\"><b>➖ Matrix subtraction<\/b><br>Compare before and after: M − T gives the exact change on every road.<\/div>\n      <div class=\"card pop\" style=\"--d:2.1s\"><b>✖ Scalar multiplication<\/b><br>Scenario testing: +20% growth is 1.2T; a 30% cut on one road is entry × 0.7.<\/div>\n      <div class=\"card pop\" style=\"--d:3s\"><b>Σ Row / column sums<\/b><br>Outgoing and incoming loads show the busiest junctions (B out 340, C in 350).<\/div><\/div>\n      <div class=\"row pop res\" style=\"--d:4s;font-size:1.2rem\">Total network: 1160 → 1392 (+20%) → 1115 (B→C cut) → 1260 (upgrades)<\/div>` }\n];\n\n/* ---------- controller ---------- */\nlet cur = 0, autoOn = false, autoTimer = null, lineTimers = [];\nfunction showStep(i) {\n  cur = i;\n  timers.forEach(clearTimeout); timers = [];\n  lineTimers.forEach(clearTimeout); lineTimers = [];\n  clearTimeout(autoTimer);\n  const s = steps[i];\n  $('stepTitle').textContent = s.t;\n  $('stepBody').innerHTML = s.lines.map(l => `"}, {"label": "🏙️ Matrices: Traffic (B)", "file": "_traficproblem.html", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Smart City Traffic Management Using Matrices<\/title>\n<style>\n  * { box-sizing: border-box; }\n  body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg,#10233a,#1b4965,#0b3d3a); color: #fff; }\n  header { text-align: center; padding: .6rem; }\n  header h1 { margin: 0; font-size: 1.35rem; color: #ffd54f; }\n  header div { font-size: .85rem; opacity: .85; }\n  .main { display: flex; flex-wrap: wrap; gap: 12px; max-width: 1280px; margin: auto; padding: 0 10px; }\n  .text { flex: 1 1 360px; background: rgba(255,255,255,.1); border-radius: 14px; padding: 12px 16px; min-height: 480px; }\n  .text h2 { margin: 0 0 8px; color: #80deea; font-size: 1.2rem; }\n  .line { opacity: 0; transform: translateX(-15px); transition: all .6s; margin: 7px 0; line-height: 1.55; font-size: 1rem; }\n  .line.show { opacity: 1; transform: none; }\n  .hl { background: rgba(255,213,79,.18); border-left: 4px solid #ffd54f; padding: 4px 8px; border-radius: 4px; }\n  .res { color: #b9f6ca; font-weight: bold; }\n  .viz { flex: 1 1 640px; background: rgba(0,0,0,.35); border: 2px solid #3b5575; border-radius: 14px; min-height: 480px; padding: 10px; text-align: center; }\n  .vt { color: #ffe082; font-size: 1rem; margin-bottom: 4px; min-height: 1.3rem; }\n  .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; margin: 6px 0; }\n  .op { font-size: 1.8rem; font-weight: bold; }\n  table.gm { border-collapse: collapse; margin: 2px; }\n  table.gm th { color: #80deea; font-size: .85rem; padding: 4px 8px; }\n  table.gm th.xh { color: #ffd54f; }\n  table.gm td { border: 1px solid #55708f; padding: 6px 10px; min-width: 46px; font-size: 1.05rem; transition: all .5s; border-radius: 4px; }\n  table.gm td.xc, table.gm td.xr { color: #ffd54f; font-weight: bold; border-color: #ffd54f55; }\n  table.sm td { padding: 4px 7px; min-width: 36px; font-size: .85rem; }\n  table.sm th { font-size: .75rem; padding: 3px 6px; }\n  .cap { font-size: .85rem; color: #9fe3ff; margin-top: 2px; }\n  .pop { opacity: 0; animation: popin .5s forwards; animation-delay: var(--d, 0s); }\n  @keyframes popin { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }\n  .pivot { background: #ffd54f; color: #222 !important; font-weight: bold; }\n  .rowhl { background: #1976d2; }\n  .colhl { background: #ef6c00; }\n  .minor { background: #2e7d32; }\n  .detail { font-size: 1rem; color: #ffe082; min-height: 2.8rem; margin-top: 6px; line-height: 1.5; }\n  svg.net { width: 100%; max-width: 400px; background: rgba(255,255,255,.05); border-radius: 12px; }\n  .ar line { stroke: #4fc3f7; stroke-dasharray: 10 7; animation: flow 1s linear infinite; }\n  .ar polygon { fill: #4fc3f7; }\n  .ar text { fill: #fff; font-size: 11px; font-weight: bold; }\n  .ar { transition: opacity .4s; }\n  .ar.dim { opacity: .1; }\n  .ar.hi line { stroke: #ffd54f; } .ar.hi polygon { fill: #ffd54f; } .ar.hi text { fill: #ffd54f; font-size: 13px; }\n  @keyframes flow { to { stroke-dashoffset: -34; } }\n  .nd { fill: #0d47a1; stroke: #fff; stroke-width: 2; transition: all .4s; }\n  .nd.on { fill: #f57c00; }\n  .nt { fill: #fff; font-size: 20px; font-weight: bold; text-anchor: middle; }\n  .bars { text-align: left; width: 300px; margin: 8px auto; }\n  .bar { display: flex; align-items: center; gap: 8px; margin: 8px 0; }\n  .bar .lb { width: 24px; font-weight: bold; font-size: 1.1rem; }\n  .bar .fillb { height: 26px; background: linear-gradient(90deg,#4fc3f7,#1976d2); border-radius: 6px; width: 0; transition: width 1.4s; }\n  .bar .fillb.top { background: linear-gradient(90deg,#ffd54f,#ff9800); }\n  .bar .vv { font-weight: bold; }\n  .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 560px; margin: 8px auto; text-align: left; }\n  .card { background: rgba(255,255,255,.12); border-radius: 10px; padding: 8px 10px; font-size: .95rem; line-height: 1.45; }\n  .card b { color: #ffd54f; }\n  .controls { text-align: center; margin: 10px 0; }\n  button { background: #ffd54f; color: #222; border: 0; border-radius: 8px; padding: .5rem 1.1rem; font-weight: bold; font-size: 1rem; cursor: pointer; margin: 2px; }\n  button:disabled { opacity: .4; cursor: default; }\n  .dots { text-align: center; margin-bottom: 12px; }\n  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #55708f; margin: 0 3px; cursor: pointer; }\n  .dot.on { background: #ffd54f; transform: scale(1.3); }\n<\/style>\n<\/head>\n<body>\n<header>\n  <h1>🚦 Smart City Traffic Management Using Matrices<\/h1>\n  <div>Engineering Mathematics · Diploma Engineering · Civil &amp; Transportation Engineering<\/div>\n<\/header>\n\n<div class=\"main\">\n  <div class=\"text\"><h2 id=\"stepTitle\"><\/h2><div id=\"stepBody\"><\/div><\/div>\n  <div class=\"viz\" id=\"viz\"><\/div>\n<\/div>\n\n<div class=\"controls\">\n  <button id=\"prev\" onclick=\"go(-1)\">⏮ Back<\/button>\n  <button id=\"auto\" onclick=\"toggleAuto()\">▶ Auto-play<\/button>\n  <button id=\"next\" onclick=\"go(1)\">Next ⏭<\/button>\n<\/div>\n<div class=\"dots\" id=\"dots\"><\/div>\n\n<script>\nconst $ = id => document.getElementById(id);\nconst N = ['A', 'B', 'C', 'D'];\nconst T = [[0,120,80,60],[100,0,150,90],[70,110,0,130],[50,80,120,0]];\nconst T20 = T.map(r => r.map(v => v * 1.2));\nconst T2 = T.map(r => r.slice()); T2[1][2] = 105;\nconst M = T.map(r => r.slice()); M[0][1] = 150; M[1][2] = 190; M[2][3] = 150; M[3][0] = 60;\nconst DT = M.map((r, i) => r.map((v, j) => v - T[i][j]));\nconst rs = (m, i) => m[i].reduce((a, b) => a + b, 0);\nconst cs = (m, j) => m.reduce((a, r) => a + r[j], 0);\nconst tot = m => m.reduce((a, r) => a + r.reduce((x, y) => x + y, 0), 0);\nconst fmt = v => Number.isInteger(v) ? v : +v.toFixed(1);\nconst OUT = T.map((_, i) => rs(T, i)), IN = N.map((_, j) => cs(T, j));\nlet timers = [];\nconst later = (f, ms) => timers.push(setTimeout(f, ms));\nconst cell = (id, i, j) => $(`${id}_${i}_${j}`);\n\nfunction grid(m, id, o = {}) {\n  const d0 = o.d || 0;\n  let h = `<table class=\"gm ${o.sm ? 'sm' : ''}\"><tr><th><\/th>${N.map(n => `<th>${n}<\/th>`).join('')}${o.xc ? `<th class=\"xh\">${o.xc}<\/th>` : ''}<\/tr>`;\n  m.forEach((r, i) => {\n    h += `<tr><th>${N[i]}<\/th>${r.map((v, j) => `<td id=\"${id}_${i}_${j}\" class=\"pop\" style=\"--d:${d0 + (i * 4 + j) * 0.06}s\">${fmt(v)}<\/td>`).join('')}${o.xc ? `<td id=\"${id}_${i}_c\" class=\"xc\">${o.fill ? fmt(rs(m, i)) : ''}<\/td>` : ''}<\/tr>`;\n  });\n  if (o.xr) h += `<tr><th class=\"xh\">${o.xr}<\/th>${N.map((_, j) => `<td id=\"${id}_r_${j}\" class=\"xr\">${o.fill ? fmt(cs(m, j)) : ''}<\/td>`).join('')}${o.xc ? `<td id=\"${id}_r_c\" class=\"xr\">${o.fill ? fmt(tot(m)) : ''}<\/td>` : ''}<\/tr>`;\n  return h + '<\/table>';\n}\nfunction setExtras(id, m) {\n  N.forEach((_, i) => { $(`${id}_${i}_c`).textContent = fmt(rs(m, i)); $(`${id}_r_${i}`).textContent = fmt(cs(m, i)); });\n  $(`${id}_r_c`).textContent = fmt(tot(m));\n}\n\nconst P = [[70, 70], [330, 70], [330, 260], [70, 260]];\nfunction netSVG(m, id) {\n  let s = `<svg viewBox=\"0 0 400 330\" class=\"net\" id=\"${id}\">`;\n  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {\n    if (i === j || !m[i][j]) continue;\n    const [x1, y1] = P[i], [x2, y2] = P[j], dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);\n    const ux = dx / len, uy = dy / len, px = -uy, py = ux, o = 9;\n    const sx = x1 + ux * 28 + px * o, sy = y1 + uy * 28 + py * o, ex = x2 - ux * 30 + px * o, ey = y2 - uy * 30 + py * o;\n    const b1 = [ex - ux * 11 + px * 5, ey - uy * 11 + py * 5], b2 = [ex - ux * 11 - px * 5, ey - uy * 11 - py * 5];\n    const lx = sx + (ex - sx) * 0.3 + px * 13, ly = sy + (ey - sy) * 0.3 + py * 13 + 4;\n    s += `<g id=\"${id}_${i}_${j}\" class=\"ar\"><line x1=\"${sx}\" y1=\"${sy}\" x2=\"${ex}\" y2=\"${ey}\" stroke-width=\"${1.5 + m[i][j] / 35}\"/>\n      <polygon points=\"${ex},${ey} ${b1[0]},${b1[1]} ${b2[0]},${b2[1]}\"/><text x=\"${lx}\" y=\"${ly}\" text-anchor=\"middle\">${fmt(m[i][j])}<\/text><\/g>`;\n  }\n  N.forEach((n, i) => { s += `<circle id=\"${id}_n${i}\" class=\"nd\" cx=\"${P[i][0]}\" cy=\"${P[i][1]}\" r=\"24\"/><text class=\"nt\" x=\"${P[i][0]}\" y=\"${P[i][1] + 7}\">${n}<\/text>`; });\n  return s + '<\/svg>';\n}\nfunction netMode(id, mode, k) {\n  for (let i = 0; i < 4; i++) {\n    $(`${id}_n${i}`).classList.toggle('on', mode !== 'none' && i === k);\n    for (let j = 0; j < 4; j++) {\n      const g = $(`${id}_${i}_${j}`); if (!g) continue;\n      g.classList.remove('dim', 'hi');\n      if (mode === 'out') g.classList.add(i === k ? 'hi' : 'dim');\n      if (mode === 'in') g.classList.add(j === k ? 'hi' : 'dim');\n    }\n  }\n}\nfunction bars(vals, id) {\n  return `<div class=\"bars\">${vals.map((v, i) => `<div class=\"bar\"><div class=\"lb\">${N[i]}<\/div><div class=\"fillb\" id=\"${id}${i}\"><\/div><div class=\"vv\" id=\"${id}v${i}\"><\/div><\/div>`).join('')}<\/div>`;\n}\nfunction growBars(vals, id, top) {\n  vals.forEach((v, i) => later(() => {\n    const b = $(id + i); b.style.width = (v / 400 * 100) + '%'; $(id + 'v' + i).textContent = v;\n    if (i === top) later(() => b.classList.add('top'), 1500);\n  }, 300 + i * 250));\n}\nconst cellHL = (id, mode, k, cls) => { for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) cell(id, i, j).className = ((mode === 'row' && i === k) || (mode === 'col' && j === k)) ? cls : ''; };\nconst clearHL = id => { for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) cell(id, i, j).className = ''; };\n\nconst steps = [\n  { t: '1. The smart-city traffic network',\n    lines: [\n      'A smart city has four junctions: <b>A, B, C, D<\/b>. A survey counts the vehicles travelling from one junction to another in one hour.',\n      'The animation shows each flow as an arrow. <b>Thicker arrow = more vehicles<\/b>, and the moving dashes show the direction.',\n      'No vehicle travels from a junction to itself, so those flows are 0.',\n      'Goal: use <b>matrices<\/b> to analyse and manage this traffic.'\n    ],\n    viz: () => `<div class=\"vt\">Vehicles per hour between junctions<\/div>${netSVG(T, 'net')}` },\n\n  { t: '2. Traffic data as a matrix',\n    lines: [\n      'Rows = <b>From<\/b> junction, columns = <b>To<\/b> junction. The entry t<sub>ij<\/sub> is the number of vehicles going from junction i to junction j.',\n      'Example: t<sub>23<\/sub> = 150 means 150 vehicles per hour go from B to C.',\n      '<div class=\"hl res\">T is a 4 × 4 square matrix with zeros on the diagonal.<\/div>'\n    ],\n    viz: () => `<div class=\"vt\">Traffic matrix T (From ↓, To →)<\/div><div class=\"row\">${grid(T, 't', { d: .2 })}<\/div>\n      <div class=\"cap pop\" style=\"--d:2s\">T = [[0,120,80,60], [100,0,150,90], [70,110,0,130], [50,80,120,0]]<\/div>` },\n\n  { t: '3. Vehicles leaving each junction',\n    lines: [\n      'Outgoing traffic of a junction = <b>sum of its row<\/b>.',\n      'A: 0 + 120 + 80 + 60 = <span class=\"res\">260<\/span>',\n      'B: 100 + 0 + 150 + 90 = <span class=\"res\">340<\/span>',\n      'C: 70 + 110 + 0 + 130 = <span class=\"res\">310<\/span>',\n      'D: 50 + 80 + 120 + 0 = <span class=\"res\">250<\/span>'\n    ],\n    viz: () => `<div class=\"vt\">Row sums = outgoing traffic<\/div><div class=\"row\">${netSVG(T, 'net')}<div>${grid(T, 'g', { xc: 'Out' })}<\/div><\/div><div class=\"detail\" id=\"dd\"><\/div>`,\n    after: () => {\n      [0, 1, 2, 3].forEach(i => later(() => {\n        cellHL('g', 'row', i, 'rowhl'); netMode('net', 'out', i);\n        $('dd').innerHTML = `Junction ${N[i]}: ${T[i].join(' + ')} = ${OUT[i]}`;\n        const c = $(`g_${i}_c`); c.textContent = OUT[i]; c.classList.add('pivot');\n      }, 1500 + i * 2600));\n      later(() => { clearHL('g'); netMode('net', 'none'); $('dd').innerHTML = '<span class=\"res\">Outgoing: A = 260, B = 340, C = 310, D = 250<\/span>'; }, 1500 + 4 * 2600);\n    } },\n\n  { t: '4. Vehicles entering each junction',\n    lines: [\n      'Incoming traffic of a junction = <b>sum of its column<\/b>.',\n      'A: 0 + 100 + 70 + 50 = <span class=\"res\">220<\/span>',\n      'B: 120 + 0 + 110 + 80 = <span class=\"res\">310<\/span>',\n      'C: 80 + 150 + 0 + 120 = <span class=\"res\">350<\/span>',\n      'D: 60 + 90 + 130 + 0 = <span class=\"res\">280<\/span>'\n    ],\n    viz: () => `<div class=\"vt\">Column sums = incoming traffic<\/div><div class=\"row\">${netSVG(T, 'net')}<div>${grid(T, 'g', { xr: 'In' })}<\/div><\/div><div class=\"detail\" id=\"dd\"><\/div>`,\n    after: () => {\n      [0, 1, 2, 3].forEach(j => later(() => {\n        cellHL('g', 'col', j, 'colhl'); netMode('net', 'in', j);\n        $('dd').innerHTML = `Junction ${N[j]}: ${T.map(r => r[j]).join(' + ')} = ${IN[j]}`;\n        const c = $(`g_r_${j}`); c.textContent = IN[j]; c.classList.add('pivot');\n      }, 1500 + j * 2600));\n      later(() => { clearHL('g'); netMode('net', 'none'); $('dd').innerHTML = '<span class=\"res\">Incoming: A = 220, B = 310, C = 350, D = 280<\/span>'; }, 1500 + 4 * 2600);\n    } },\n\n  { t: '5. Total traffic in the network',\n    lines: [\n      'Total = sum of <b>all entries<\/b> of T = sum of the outgoing totals.',\n      '260 + 340 + 310 + 250 = <span class=\"res\">1160<\/span>',\n      'Check with incoming totals: 220 + 310 + 350 + 280 = 1160 ✔',\n      '<div class=\"hl res\">Total traffic = 1160 vehicles per hour.<\/div>',\n      'Every vehicle that leaves one junction enters another, so the two totals must match.'\n    ],\n    viz: () => `<div class=\"vt\">Row sums and column sums<\/div><div class=\"row\">${grid(T, 'g', { xc: 'Out', xr: 'In', fill: true, d: .2 })}<\/div>\n      <div class=\"row pop\" style=\"--d:2s;font-size:1.3rem\">260 + 340 + 310 + 250 = <span class=\"res\">1160<\/span><\/div>\n      <div class=\"row pop\" style=\"--d:3.2s;font-size:1.3rem\">220 + 310 + 350 + 280 = <span class=\"res\">1160<\/span> ✔<\/div>` },\n\n  { t: '6. Highest outgoing traffic',\n    lines: [\n      'Compare the outgoing totals: A = 260, B = 340, C = 310, D = 250.',\n      '<div class=\"hl res\">Junction B has the highest outgoing traffic: 340 vehicles per hour.<\/div>',\n      'B is the busiest <i>source<\/i>. Engineers may add exit lanes or adjust the signal timing here.'\n    ],\n    viz: () => `<div class=\"vt\">Outgoing traffic per junction<\/div><div class=\"row\">${netSVG(T, 'net')}${bars(OUT, 'bo')}<\/div>`,\n    after: () => { growBars(OUT, 'bo', 1); later(() => netMode('net', 'out', 1), 2200); } },\n\n  { t: '7. Highest incoming traffic',\n    lines: [\n      'Compare the incoming totals: A = 220, B = 310, C = 350, D = 280.',\n      '<div class=\"hl res\">Junction C has the highest incoming traffic: 350 vehicles per hour.<\/div>',\n      'C is the busiest <i>destination<\/i>. It needs enough entry capacity, parking and approach lanes.'\n    ],\n    viz: () => `<div class=\"vt\">Incoming traffic per junction<\/div><div class=\"row\">${netSVG(T, 'net')}${bars(IN, 'bi')}<\/div>`,\n    after: () => { growBars(IN, 'bi', 2); later(() => netMode('net', 'in', 2), 2200); } },\n\n  { t: '8. Traffic increases by 20%',\n    lines: [\n      'Scalar multiplication: multiply <b>every entry<\/b> by 1.2.',\n      'Row A: 0, 120×1.2 = 144, 80×1.2 = 96, 60×1.2 = 72',\n      'Row B: 100×1.2 = 120, 0, 150×1.2 = 180, 90×1.2 = 108',\n      'Row C: 70×1.2 = 84, 110×1.2 = 132, 0, 130×1.2 = 156',\n      'Row D: 50×1.2 = 60, 80×1.2 = 96, 120×1.2 = 144, 0',\n      '<div class=\"hl res\">New total = 1.2 × 1160 = 1392 vehicles per hour.<\/div>'\n    ],\n    viz: () => `<div class=\"vt\">New matrix = 1.2 × T<\/div><div class=\"row\"><span class=\"op\">1.2 ×<\/span>${grid(T, 'g', { xc: 'Out', xr: 'In', fill: true, d: .2 })}<\/div><div class=\"detail\" id=\"dd\">Watch every entry being multiplied by 1.2…<\/div>`,\n    after: () => {\n      for (let k = 0; k < 16; k++) {\n        const i = Math.floor(k / 4), j = k % 4;\n        later(() => { const c = cell('g', i, j); c.textContent = fmt(T20[i][j]); c.className = 'minor'; }, 1500 + k * 170);\n      }\n      later(() => { setExtras('g', T20); $('dd').innerHTML = '<span class=\"res\">New outgoing: A = 312, B = 408, C = 372, D = 300 (total 1392)<\/span>'; }, 1500 + 16 * 170 + 400);\n    } },\n\n  { t: '9. Reduce B → C traffic by 30%',\n    lines: [\n      'Reduction by 30% means multiplying that entry by 0.7. Only t<sub>23<\/sub> (B → C) changes. (Applied to the original matrix T.)',\n      't<sub>23<\/sub> = 150 × 0.7 = <span class=\"res\">105<\/span>',\n      '<div class=\"hl\">Updated row B: [100, 0, 105, 90]<\/div>',\n      'New totals: B out = 295, C in = 305, network total = 1160 − 45 = <span class=\"res\">1115<\/span>.',\n      '<b>Insight:<\/b> C now has the highest outgoing traffic (310) and B has the highest incoming traffic (310).'\n    ],\n    viz: () => `<div class=\"vt\">Only the B → C entry changes<\/div><div class=\"row\">${grid(T, 'g', { xc: 'Out', xr: 'In', fill: true, d: .2 })}<\/div><div class=\"detail\" id=\"dd\"><\/div>`,\n    after: () => {\n      later(() => { cell('g', 1, 2).className = 'pivot'; $('dd').innerHTML = 'Select the B → C entry (150).'; }, 1500);\n      later(() => { cell('g', 1, 2).textContent = '150×0.7'; $('dd').innerHTML = '150 × 0.7 = 105'; }, 3200);\n      later(() => { cell('g', 1, 2).textContent = '105'; setExtras('g', T2); $('dd').innerHTML = '<span class=\"res\">B out = 100 + 0 + 105 + 90 = 295 · C in = 80 + 105 + 0 + 120 = 305 · Total = 1115<\/span>'; }, 4800);\n      later(() => { $('g_2_c').classList.add('colhl'); $('g_r_1').classList.add('colhl'); $('dd').innerHTML += '<br>Highest outgoing is now C (310); highest incoming is now B (310).'; }, 6500);\n    } },\n\n  { t: '10. Advanced: original, modified and difference',\n    lines: [\n      'The new system raises the capacity of four selected roads (assumed values): A→B 120 → 150, B→C 150 → 190, C→D 130 → 150, D→A 50 → 60.',\n      '<b>Modified matrix M<\/b> = original T with those four entries increased.',\n      '<b>Difference ΔT = M − T<\/b> (subtract entry by entry). It is non-zero only on the four upgraded roads: +30, +40, +20, +10.',\n      'Check: T + ΔT = M. Total traffic: 1160 + 100 = <span class=\"res\">1260<\/span>.'\n    ],\n    viz: () => `<div class=\"vt\">Matrix addition and subtraction (orange = upgraded roads)<\/div>\n      <div class=\"row\"><div>${grid(T, 't', { sm: true, d: .2 })}<div class=\"cap\">T (original)<\/div><\/div><span class=\"op\">+<\/span>\n      <div>${grid(DT, 'dl', { sm: true, d: 1.2 })}<div class=\"cap\">ΔT = M − T<\/div><\/div><span class=\"op\">=<\/span>\n      <div>${grid(M, 'mm', { sm: true, d: 2.2 })}<div class=\"cap\">M (modified)<\/div><\/div><\/div>\n      <div class=\"detail pop\" style=\"--d:3.6s\">Total: 1160 + 100 = 1260 vehicles per hour<\/div>`,\n    after: () => { later(() => { [[0,1],[1,2],[2,3],[3,0]].forEach(([i, j]) => ['t', 'dl', 'mm'].forEach(id => cell(id, i, j).className = 'colhl')); }, 4200); } },\n\n  { t: '11. How matrix operations help engineers',\n    lines: [\n      '<b>Addition:<\/b> add matrices from different times or routes (morning + evening = daily traffic) or add planned changes: T + ΔT = M.',\n      '<b>Subtraction:<\/b> M − T shows exactly which roads changed and by how much.',\n      '<b>Scalar multiplication:<\/b> kT models growth (k = 1.2) or reduction (entry × 0.7) in quick what-if tests.',\n      '<b>Row and column sums<\/b> reveal the busiest junctions, so engineers can find bottlenecks before building anything.'\n    ],\n    viz: () => `<div class=\"vt\">Matrices make traffic planning fast and accurate<\/div><div class=\"cards\">\n      <div class=\"card pop\" style=\"--d:.3s\"><b>➕ Matrix addition<\/b><br>Combine data from different periods or add planned changes.<\/div>\n      <div class=\"card pop\" style=\"--d:1.2s\"><b>➖ Matrix subtraction<\/b><br>Compare before and after: M − T gives the exact change on every road.<\/div>\n      <div class=\"card pop\" style=\"--d:2.1s\"><b>✖ Scalar multiplication<\/b><br>Scenario testing: +20% growth is 1.2T; a 30% cut on one road is entry × 0.7.<\/div>\n      <div class=\"card pop\" style=\"--d:3s\"><b>Σ Row / column sums<\/b><br>Outgoing and incoming loads show the busiest junctions (B out 340, C in 350).<\/div><\/div>\n      <div class=\"row pop res\" style=\"--d:4s;font-size:1.2rem\">Total network: 1160 → 1392 (+20%) → 1115 (B→C cut) → 1260 (upgrades)<\/div>` }\n];\n\nlet cur = 0, autoOn = false, autoTimer = null, lineTimers = [];\nfunction showStep(i) {\n  cur = i;\n  timers.forEach(clearTimeout); timers = [];\n  lineTimers.forEach(clearTimeout); lineTimers = [];\n  clearTimeout(autoTimer);\n  const s = steps[i];\n  $('stepTitle').textContent = s.t;\n  $('stepBody').innerHTML = s.lines.map(l => `<div class=\"line\">${l}<\/div>`).join('');\n  $('viz').innerHTML = s.viz();\n  if (s.after) s.after();\n  document.querySelectorAll('.line').forEach((el, k) => lineTimers.push(setTimeout(() => el.classList.add('show'), 400 + k * 1400)));\n  $('prev').disabled = i === 0; $('next').disabled = i === steps.length - 1;\n  document.querySelectorAll('.dot').forEach((d, k) => d.classList.toggle('on', k === i));\n  if (autoOn && i < steps.length - 1) autoTimer = setTimeout(() => showStep(i + 1), 11000 + s.lines.length * 700);\n}\nfunction go(d) { const n = cur + d; if (n >= 0 && n < steps.length) showStep(n); }\nfunction toggleAuto() { autoOn = !autoOn; $('auto').textContent = autoOn ? '⏸ Stop auto' : '▶ Auto-play'; showStep(cur); }\nsteps.forEach((_, i) => { const d = document.createElement('span'); d.className = 'dot'; d.onclick = () => showStep(i); $('dots').appendChild(d); });\nshowStep(0);\n<\/script>\n<\/body>\n<\/html>"}];
const tabs = document.getElementById('tabs'), stage = document.getElementById('stage');
const frames = [];
function show(i) {
  PAGES.forEach((p, k) => {
    tabs.children[k].classList.toggle('on', k === i);
    if (frames[k]) frames[k].classList.toggle('on', k === i);
  });
  if (!frames[i]) {
    const f = document.createElement('iframe');
    f.title = PAGES[i].label;
    f.setAttribute('sandbox', 'allow-scripts allow-same-origin');
    f.srcdoc = PAGES[i].html;
    f.className = 'on';
    stage.appendChild(f); frames[i] = f;
  }
  frames.forEach((f, k) => f && f.classList.toggle('on', k === i));
  try { location.hash = 'p' + (i + 1); } catch (e) {}
}
PAGES.forEach((p, i) => {
  const b = document.createElement('button'); b.textContent = p.label; b.onclick = () => show(i); tabs.appendChild(b);

const m = /^#p(\d+)$/.exec(location.hash), start = m ? Math.min(Math.max(+m[1] - 1, 0), PAGES.length - 1) : 0;
show(start);
