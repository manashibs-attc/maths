<script>
const PAGES = [{"label": "🚗 Differential Calculus", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Electric Vehicle Speed and Acceleration – Differential Calculus<\/title>\n<style>\n  * { box-sizing: border-box; }\n  body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg,#0b1d3a,#12335f); color: #fff; }\n  h1 { text-align: center; margin: 10px 8px 2px; font-size: 1.3rem; color: #ffd54f; }\n  .sub { text-align: center; font-size: .85rem; opacity: .8; margin-bottom: 8px; }\n  .grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; max-width: 1250px; margin: auto; padding: 0 10px 16px; }\n  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }\n  .box { background: rgba(16,41,77,.88); border: 1px solid #27497a; border-radius: 14px; padding: 10px; }\n  canvas { width: 100%; display: block; background: #0c2240; border-radius: 10px; border: 1px solid #27497a; margin-bottom: 8px; }\n  .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin: 6px 0; }\n  button { background: #29b6f6; color: #04223a; border: 0; border-radius: 8px; padding: 7px 13px; font-weight: bold; cursor: pointer; }\n  button.alt { background: #ff9800; }\n  input[type=range] { accent-color: #29b6f6; }\n  .read { background: #081a31; border: 1px solid #27497a; border-radius: 10px; padding: 8px 10px; font-family: Consolas, monospace; font-size: .92rem; line-height: 1.7; }\n  .s { color: #81c784; font-weight: bold; } .v { color: #4fc3f7; font-weight: bold; } .a { color: #ffb74d; font-weight: bold; }\n  .res { color: #b9f6ca; font-weight: bold; }\n  .st { border-left: 4px solid #29b6f6; background: rgba(255,255,255,.07); border-radius: 6px; padding: 6px 10px; margin: 8px 0; line-height: 1.6; font-size: .95rem; opacity: 0; animation: fade .7s forwards; cursor: default; }\n  .st.go { cursor: pointer; } .st.go:hover { background: rgba(255,213,79,.15); }\n  .st b.h { color: #80deea; }\n  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }\n  .tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-weight: bold; font-size: .85rem; }\n  table { border-collapse: collapse; font-size: .9rem; margin-top: 4px; }\n  th, td { border: 1px solid #4a6a99; padding: 3px 9px; text-align: center; }\n  th { background: #1c4b6b; }\n<\/style>\n<\/head>\n<body>\n<h1>🚗⚡ Electric Vehicle Speed and Acceleration Using Differential Calculus<\/h1>\n<div class=\"sub\">Engineering Mathematics · Diploma Engineering · s(t) = t³ − 6t² + 15t, valid for 0 ≤ t ≤ 6 s<\/div>\n\n<div class=\"grid\">\n  <div class=\"box\">\n    <canvas id=\"road\"><\/canvas>\n    <canvas id=\"gr\"><\/canvas>\n    <div class=\"ctl\">\n      <button id=\"play\">⏸ Pause<\/button>\n      <label>Speed <input type=\"range\" id=\"spd\" min=\"0.3\" max=\"3\" step=\"0.1\" value=\"1\"><\/label>\n      <label>Time <input type=\"range\" id=\"ts\" min=\"0\" max=\"600\" value=\"0\"><\/label>\n    <\/div>\n    <div class=\"ctl\">\n      <span>Jump to:<\/span>\n      <button class=\"alt\" onclick=\"jump(0)\">t = 0<\/button>\n      <button class=\"alt\" onclick=\"jump(2)\">t = 2<\/button>\n      <button class=\"alt\" onclick=\"jump(4)\">t = 4<\/button>\n      <button class=\"alt\" onclick=\"jump(6)\">t = 6<\/button>\n    <\/div>\n    <div class=\"read\" id=\"read\"><\/div>\n  <\/div>\n  <div class=\"box\" id=\"sol\"><\/div>\n<\/div>\n\n<script>\nconst $ = id => document.getElementById(id);\nconst S = t => t*t*t - 6*t*t + 15*t, V = t => 3*t*t - 12*t + 15, A = t => 6*t - 12;\nlet t = 0, playing = true, speed = 1, last = performance.now();\nconst road = $('road'), rx = road.getContext('2d'), gr = $('gr'), gx = gr.getContext('2d');\nconst fix = v => { v = Math.abs(v) < 1e-9 ? 0 : v; return Math.round(v * 100) / 100; };\nfunction fit(c, ratio) { const w = c.parentElement.clientWidth - 22; if (w > 40 && Math.abs(c.width - w) > 1) { c.width = w; c.height = Math.round(w * ratio); } }\n\n/* ---------- road scene ---------- */\nfunction drawRoad() {\n  fit(road, 0.26);\n  const w = road.width, h = road.height, x0 = 40, x1 = w - 70, gy = h * 0.72, s = S(t), a = A(t), v = V(t);\n  const g = rx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#16426f'); g.addColorStop(1, '#0c2240');\n  rx.fillStyle = g; rx.fillRect(0, 0, w, h);\n  rx.fillStyle = '#2b3445'; rx.fillRect(0, gy, w, h - gy);\n  rx.strokeStyle = '#e0e0e0'; rx.lineWidth = 2; rx.setLineDash([16, 14]); rx.lineDashOffset = -s * 4;\n  rx.beginPath(); rx.moveTo(0, gy + (h - gy) * 0.5); rx.lineTo(w, gy + (h - gy) * 0.5); rx.stroke(); rx.setLineDash([]); rx.lineDashOffset = 0;\n  rx.font = '11px Arial'; rx.textAlign = 'center'; rx.fillStyle = '#9fb3cc';\n  for (let m = 0; m <= 90; m += 10) { const x = x0 + m / 90 * (x1 - x0); rx.fillRect(x - 1, gy - 8, 2, 8); rx.fillText(m + ' m', x, gy - 12); }\n  [[2, '#ffeb3b'], [4, '#ffeb3b'], [6, '#ffeb3b']].forEach(([tt, c]) => {\n    const x = x0 + S(tt) / 90 * (x1 - x0);\n    rx.fillStyle = c; rx.beginPath(); rx.moveTo(x, gy - 22); rx.lineTo(x - 5, gy - 32); rx.lineTo(x + 5, gy - 32); rx.fill();\n    rx.fillText('t=' + tt, x, gy - 36);\n  });\n  const cx = x0 + s / 90 * (x1 - x0), cw = Math.max(46, w * 0.07), ch = cw * 0.38, cyb = gy - 4;\n  rx.fillStyle = a < -0.05 ? '#ef5350' : (a > 0.05 ? '#43a047' : '#fdd835');\n  rx.beginPath(); rx.roundRect ? rx.roundRect(cx - cw / 2, cyb - ch, cw, ch, 6) : rx.rect(cx - cw / 2, cyb - ch, cw, ch); rx.fill();\n  rx.fillStyle = '#cfe8ff'; rx.fillRect(cx - cw * 0.2, cyb - ch * 1.6, cw * 0.4, ch * 0.6);\n  rx.fillStyle = '#0d47a1'; rx.fillRect(cx - cw * 0.18, cyb - ch * 1.55, cw * 0.36, ch * 0.5);\n  if (a < -0.05) { rx.fillStyle = '#ff1744'; rx.fillRect(cx - cw / 2 - 4, cyb - ch * 0.8, 6, ch * 0.4); rx.shadowColor = '#ff1744'; rx.shadowBlur = 14; rx.fillRect(cx - cw / 2 - 4, cyb - ch * 0.8, 6, ch * 0.4); rx.shadowBlur = 0; }\n  [-0.3, 0.3].forEach(o => {\n    const wx = cx + o * cw, r = ch * 0.38;\n    rx.fillStyle = '#111'; rx.beginPath(); rx.arc(wx, cyb, r, 0, 7); rx.fill();\n    rx.strokeStyle = '#bbb'; rx.lineWidth = 2; const ang = s * 0.9;\n    rx.beginPath(); rx.moveTo(wx - r * Math.cos(ang), cyb - r * Math.sin(ang)); rx.lineTo(wx + r * Math.cos(ang), cyb + r * Math.sin(ang)); rx.stroke();\n  });\n  rx.fillStyle = '#fff'; rx.font = 'bold 11px Arial'; rx.fillText('⚡EV', cx, cyb - ch * 0.35);\n  const st = a < -0.05 ? ['DECELERATING (a &lt; 0)', '#ef5350'] : (a > 0.05 ? ['ACCELERATING (a &gt; 0)', '#43a047'] : ['CONSTANT SPEED (a = 0)', '#fdd835']);\n  $('read').dataset.st = st[0]; $('read').dataset.col = st[1];\n}\n\n/* ---------- graphs ---------- */\nconst PN = [\n  { lab: 's (m)', min: 0, max: 98, f: S, d: V, col: '#66bb6a', ticks: [0, 30, 60, 90] },\n  { lab: 'v (m/s)', min: 0, max: 58, f: V, d: A, col: '#4fc3f7', ticks: [0, 15, 30, 45] },\n  { lab: 'a (m/s²)', min: -17, max: 28, f: A, d: () => 6, col: '#ffb74d', ticks: [-12, 0, 12, 24] }\n];\nfunction drawGraphs() {\n  fit(gr, 0.95);\n  const w = gr.width, h = gr.height, L = 58, R = 14, B = 28, ph = (h - B) / 3, pw = w - L - R;\n  gx.clearRect(0, 0, w, h);\n  const X = tt => L + tt / 6 * pw;\n  PN.forEach((P, k) => {\n    const top = k * ph + 6, hh = ph - 14, Y = y => top + hh - (y - P.min) / (P.max - P.min) * hh;\n    gx.fillStyle = 'rgba(255,255,255,.03)'; gx.fillRect(L, top, pw, hh);\n    if (k === 2) {\n      gx.fillStyle = 'rgba(244,67,54,.16)'; gx.fillRect(X(0), top, X(2) - X(0), hh);\n      gx.fillStyle = 'rgba(76,175,80,.16)'; gx.fillRect(X(2), top, X(6) - X(2), hh);\n      gx.font = '11px Arial'; gx.textAlign = 'center'; gx.fillStyle = '#ff8a80'; gx.fillText('decelerating', X(1), top + 12); gx.fillStyle = '#a5d6a7'; gx.fillText('accelerating', X(4), top + 12);\n    }\n    gx.font = '11px Arial'; gx.strokeStyle = '#2b4468'; gx.lineWidth = 1;\n    P.ticks.forEach(v => { gx.beginPath(); gx.moveTo(L, Y(v)); gx.lineTo(L + pw, Y(v)); gx.stroke(); gx.fillStyle = P.col; gx.textAlign = 'right'; gx.fillText(v, L - 5, Y(v) + 4); });\n    for (let q = 0; q <= 6; q++) { gx.beginPath(); gx.moveTo(X(q), top); gx.lineTo(X(q), top + hh); gx.stroke(); if (k === 2) { gx.fillStyle = '#9fb3cc'; gx.textAlign = 'center'; gx.fillText(q, X(q), h - 12); } }\n    gx.fillStyle = P.col; gx.font = 'bold 12px Arial'; gx.textAlign = 'left'; gx.fillText(P.lab, 4, top + 12);\n    if (k === 2) { gx.fillStyle = '#fff'; gx.textAlign = 'center'; gx.fillText('time t (s)', L + pw / 2, h - 1); }\n    const curve = (tmax, col, lw) => { gx.strokeStyle = col; gx.lineWidth = lw; gx.beginPath(); for (let u = 0, i = 0; u <= tmax + 1e-9; u += 0.02, i++) i ? gx.lineTo(X(u), Y(P.f(u))) : gx.moveTo(X(u), Y(P.f(u))); gx.stroke(); };\n    curve(6, P.col + '44', 2); curve(t, P.col, 3.5);\n    [2, 4, 6].forEach(q => { gx.beginPath(); gx.arc(X(q), Y(P.f(q)), 4, 0, 7); gx.strokeStyle = '#ffeb3b'; gx.lineWidth = 2; gx.stroke(); });\n    if (k === 1) { gx.fillStyle = '#ffeb3b'; gx.textAlign = 'left'; gx.fillText('minimum 3 m/s at t = 2', X(2) + 8, Y(3) - 6); }\n    if (k === 2) { gx.fillStyle = '#ffeb3b'; gx.textAlign = 'left'; gx.fillText('a = 0 at t = 2 s', X(2) + 8, Y(0) - 6); }\n    const yv = P.f(t), m = P.d(t), dt = 0.55;\n    gx.strokeStyle = '#fff'; gx.lineWidth = 2; gx.beginPath(); gx.moveTo(X(t - dt), Y(yv - dt * m)); gx.lineTo(X(t + dt), Y(yv + dt * m)); gx.stroke();\n    gx.fillStyle = P.col; gx.beginPath(); gx.arc(X(t), Y(yv), 6, 0, 7); gx.fill(); gx.strokeStyle = '#fff'; gx.lineWidth = 2; gx.stroke();\n    gx.fillStyle = '#fff'; gx.font = '11px Arial'; gx.textAlign = X(t) > w * 0.75 ? 'right' : 'left';\n    gx.fillText((k === 0 ? 'slope = v = ' : k === 1 ? 'slope = a = ' : 'slope = ') + fix(m), X(t) + (X(t) > w * 0.75 ? -10 : 10), Y(yv) - 10);\n  });\n  gx.strokeStyle = '#ffffff99'; gx.setLineDash([4, 4]); gx.beginPath(); gx.moveTo(X(t), 4); gx.lineTo(X(t), h - B); gx.stroke(); gx.setLineDash([]);\n}\n\nfunction readout() {\n  const s = S(t), v = V(t), a = A(t);\n  $('read').innerHTML =\n    `t = <b>${t.toFixed(2)} s<\/b><br>` +\n    `<span class=\"s\">s = t³ − 6t² + 15t = ${fix(s)} m<\/span><br>` +\n    `<span class=\"v\">v = 3t² − 12t + 15 = 3(${t.toFixed(2)})² − 12(${t.toFixed(2)}) + 15 = ${fix(v)} m/s<\/span><br>` +\n    `<span class=\"a\">a = 6t − 12 = 6(${t.toFixed(2)}) − 12 = ${fix(a)} m/s²<\/span><br>` +\n    `<span class=\"tag\" style=\"background:${$('read').dataset.col};color:#111\">${$('read').dataset.st}<\/span>`;\n}\n\n/* ---------- solution panel ---------- */\nconst steps = [\n  ['1. Velocity function', 'v = ds/dt. Differentiate s = t³ − 6t² + 15t term by term using the power rule d(tⁿ)/dt = n·tⁿ⁻¹:<br>d(t³)/dt = 3t² &nbsp;|&nbsp; d(−6t²)/dt = −12t &nbsp;|&nbsp; d(15t)/dt = 15<br><span class=\"res\">v(t) = 3t² − 12t + 15 (m/s)<\/span>', null],\n  ['2. Acceleration function', 'a = dv/dt. Differentiate v = 3t² − 12t + 15:<br>d(3t²)/dt = 6t &nbsp;|&nbsp; d(−12t)/dt = −12 &nbsp;|&nbsp; d(15)/dt = 0 (constant)<br><span class=\"res\">a(t) = 6t − 12 (m/s²)<\/span>', null],\n  ['3. Velocity at t = 2 s', 'v(2) = 3(2)² − 12(2) + 15 = 12 − 24 + 15 = <span class=\"res\">3 m/s<\/span>', 2],\n  ['4. Acceleration at t = 2 s', 'a(2) = 6(2) − 12 = <span class=\"res\">0 m/s²<\/span>', 2],\n  ['5. Velocity at t = 4 s', 'v(4) = 3(4)² − 12(4) + 15 = 48 − 48 + 15 = <span class=\"res\">15 m/s<\/span> &nbsp;(and a(4) = 12 m/s²)', 4],\n  ['6. Accelerating or decelerating at t = 2 s?', 'a(2) = 0, so at that instant the car is <b>neither<\/b> accelerating nor decelerating: its speed is momentarily steady at its lowest value.<br>For t &lt; 2: a &lt; 0 → <span style=\"color:#ff8a80\">decelerating<\/span> (speed falls from 15 to 3 m/s). For t &gt; 2: a &gt; 0 → <span style=\"color:#a5d6a7\">accelerating<\/span>.', 2],\n  ['7. The three graphs', '<span class=\"s\">s–t<\/span> rises steadily (cubic). <span class=\"v\">v–t<\/span> is a parabola with minimum 3 m/s at t = 2. <span class=\"a\">a–t<\/span> is a straight line from −12 to +24 m/s².<br>The white tangent shows: slope of s–t = v, slope of v–t = a.', null],\n  ['8. When is a = 0?', '6t − 12 = 0 → t = 12/6 = <span class=\"res\">2 s<\/span>.<br>Check: since a = dv/dt = 0 here and v″ = 6 &gt; 0, velocity has its <b>minimum<\/b>, v(2) = 3 m/s.', 2],\n  ['9. Physical meaning of the derivatives', '<b>First derivative ds/dt = velocity:<\/b> how fast the position changes (slope of the s–t graph).<br><b>Second derivative d²s/dt² = acceleration:<\/b> how fast the velocity changes (slope of the v–t graph, curvature of the s–t graph).<br>Positive a: speeding up. Negative a: slowing down.', null],\n  ['Bonus: the whole 6-second journey', 's(6) = 6³ − 6(6²) + 15(6) = 216 − 216 + 90 = <span class=\"res\">90 m<\/span>.<br>Velocity: v(0) = 15, falls to v(2) = 3, then rises to v(6) = 3(36) − 72 + 15 = 51 m/s.<br>Because 3t² − 12t + 15 never reaches 0 (discriminant 144 − 180 &lt; 0), v &gt; 0 always: the car never reverses.<br>Average velocity = 90/6 = 15 m/s.' +\n   '<table><tr><th>t (s)<\/th><th>0<\/th><th>2<\/th><th>4<\/th><th>6<\/th><\/tr><tr><th>s (m)<\/th><td>0<\/td><td>14<\/td><td>28<\/td><td>90<\/td><\/tr><tr><th>v (m/s)<\/th><td>15<\/td><td>3<\/td><td>15<\/td><td>51<\/td><\/tr><tr><th>a (m/s²)<\/th><td>−12<\/td><td>0<\/td><td>12<\/td><td>24<\/td><\/tr><\/table>', 6]\n];\n$('sol').innerHTML = steps.map((s, i) => `<div class=\"st ${s[2] !== null ? 'go' : ''}\" style=\"animation-delay:${0.3 + i * 0.45}s\" ${s[2] !== null ? `onclick=\"jump(${s[2]})\"` : ''}><b class=\"h\">${s[0]}<\/b>${s[2] !== null ? ' <span style=\"font-size:.75rem;color:#ffd54f\">(click to jump to t = ' + s[2] + ')<\/span>' : ''}<br>${s[1]}<\/div>`).join('');\n\n/* ---------- controls and loop ---------- */\nfunction jump(tt) { t = tt; playing = false; $('play').textContent = '▶ Play'; $('ts').value = tt * 100; }\n$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '⏸ Pause' : '▶ Play'; if (playing && t >= 6) t = 0; };\n$('spd').oninput = e => speed = +e.target.value;\n$('ts').oninput = e => { playing = false; $('play').textContent = '▶ Play'; t = e.target.value / 100; };\nfunction loop(now) {\n  const dt = (now - last) / 1000; last = now;\n  if (playing) { t += dt * 0.6 * speed; if (t > 6.6) t = 0; if (t > 6) t = 6; $('ts').value = t * 100; }\n  drawRoad(); drawGraphs(); readout();\n  requestAnimationFrame(loop);\n}\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>"}, {"label": "💧 Integral Calculus", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Smart Water Tank Filling System – Integral Calculus<\/title>\n<style>\n  * { box-sizing: border-box; }\n  body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg,#0b1d3a,#0f3a5f); color: #fff; }\n  h1 { text-align: center; margin: 10px 8px 2px; font-size: 1.3rem; color: #ffd54f; }\n  .sub { text-align: center; font-size: .85rem; opacity: .8; margin-bottom: 8px; }\n  .grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; max-width: 1250px; margin: auto; padding: 0 10px 16px; }\n  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }\n  .box { background: rgba(16,41,77,.88); border: 1px solid #27497a; border-radius: 14px; padding: 10px; }\n  canvas { width: 100%; display: block; background: #0c2240; border-radius: 10px; border: 1px solid #27497a; margin-bottom: 8px; }\n  .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin: 6px 0; font-size: .9rem; }\n  button { background: #29b6f6; color: #04223a; border: 0; border-radius: 8px; padding: 7px 13px; font-weight: bold; cursor: pointer; }\n  button.alt { background: #ff9800; }\n  input[type=range] { accent-color: #29b6f6; }\n  .read { background: #081a31; border: 1px solid #27497a; border-radius: 10px; padding: 8px 10px; font-family: Consolas, monospace; font-size: .9rem; line-height: 1.7; }\n  .q { color: #4fc3f7; font-weight: bold; } .vol { color: #80deea; font-weight: bold; }\n  .res { color: #b9f6ca; font-weight: bold; }\n  .st { border-left: 4px solid #29b6f6; background: rgba(255,255,255,.07); border-radius: 6px; padding: 6px 10px; margin: 8px 0; line-height: 1.6; font-size: .95rem; opacity: 0; animation: fade .7s forwards; }\n  .st.go { cursor: pointer; } .st.go:hover { background: rgba(255,213,79,.15); }\n  .st b.h { color: #80deea; }\n  .tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-weight: bold; font-size: .85rem; color: #111; }\n  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }\n<\/style>\n<\/head>\n<body>\n<h1>💧 Smart Water Tank Filling System Using Integral Calculus<\/h1>\n<div class=\"sub\">Engineering Mathematics · Diploma Engineering · Q(t) = 5t + 10 litres/min, pump runs for 10 minutes, tank capacity 400 L<\/div>\n\n<div class=\"grid\">\n  <div class=\"box\">\n    <canvas id=\"tank\"><\/canvas>\n    <canvas id=\"gr\"><\/canvas>\n    <div class=\"ctl\">\n      <button id=\"play\">⏸ Pause<\/button>\n      <label>Speed <input type=\"range\" id=\"spd\" min=\"0.3\" max=\"3\" step=\"0.1\" value=\"1\"><\/label>\n      <label>Time <input type=\"range\" id=\"ts\" min=\"0\" max=\"1200\" value=\"0\"><\/label>\n    <\/div>\n    <div class=\"ctl\">\n      <button class=\"alt\" onclick=\"jump(0)\">t = 0<\/button>\n      <button class=\"alt\" onclick=\"jump(5)\">t = 5<\/button>\n      <button class=\"alt\" onclick=\"jump(10)\">t = 10<\/button>\n      <label><input type=\"checkbox\" id=\"bonus\"> Bonus: keep pumping until full<\/label>\n    <\/div>\n    <div class=\"ctl\">\n      <label><input type=\"checkbox\" id=\"rs\"> Show Riemann strips<\/label>\n      <label>n = <b id=\"nl\">5<\/b> <input type=\"range\" id=\"ns\" min=\"1\" max=\"40\" value=\"5\"><\/label>\n    <\/div>\n    <div class=\"read\" id=\"read\"><\/div>\n  <\/div>\n  <div class=\"box\" id=\"sol\"><\/div>\n<\/div>\n\n<script>\nconst $ = id => document.getElementById(id);\nconst Q = t => 5 * t + 10, V = t => 2.5 * t * t + 10 * t;\nconst TFULL = (-4 + Math.sqrt(656)) / 2;   // 10.806 min\nlet t = 0, playing = true, speed = 1, last = performance.now(), bonus = false;\nconst tank = $('tank'), tx = tank.getContext('2d'), gr = $('gr'), gx = gr.getContext('2d');\nconst fix = v => Math.round(v * 100) / 100;\nconst tmax = () => bonus ? TFULL : 10;\nfunction fit(c, ratio) { const w = c.parentElement.clientWidth - 22; if (w > 40 && Math.abs(c.width - w) > 1) { c.width = w; c.height = Math.round(w * ratio); } }\n\n/* ---------- tank scene ---------- */\nfunction drawTank(now) {\n  fit(tank, 0.52);\n  const w = tank.width, h = tank.height, v = Math.min(V(t), 400), frac = v / 400, q = Q(t);\n  const tl = w * 0.5, tr = w * 0.86, tt = h * 0.2, tb = h * 0.92, th = tb - tt;\n  const pumping = t < tmax() - 1e-9 || (!bonus && t < 10 - 1e-9);\n  const g = tx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#16426f'); g.addColorStop(1, '#0c2240');\n  tx.fillStyle = g; tx.fillRect(0, 0, w, h);\n  tx.fillStyle = '#37474f'; tx.fillRect(0, tb, w, h - tb);\n  // pump and pipe\n  tx.fillStyle = '#546e7a'; tx.fillRect(w * 0.04, h * 0.1, w * 0.14, h * 0.2);\n  tx.fillStyle = pumping ? '#4caf50' : '#f44336'; tx.beginPath(); tx.arc(w * 0.11, h * 0.2, 9, 0, 7); tx.fill();\n  tx.fillStyle = '#fff'; tx.font = 'bold 12px Arial'; tx.textAlign = 'center'; tx.fillText('PUMP', w * 0.11, h * 0.08);\n  tx.fillStyle = '#78909c'; tx.fillRect(w * 0.18, h * 0.15, tl + (tr - tl) * 0.3 - w * 0.18, 12);\n  const px = tl + (tr - tl) * 0.3 + 6;\n  tx.fillRect(px - 6, h * 0.15, 12, tt - h * 0.15 + 6);\n  // water\n  const wy = tb - frac * th;\n  tx.fillStyle = '#e3f2fd22'; tx.fillRect(tl, tt, tr - tl, th);\n  tx.fillStyle = '#29b6f6cc'; tx.beginPath(); tx.moveTo(tl, tb);\n  for (let x = tl; x <= tr; x += 4) tx.lineTo(x, wy + 3 * Math.sin(x * 0.06 + now * 0.004));\n  tx.lineTo(tr, tb); tx.closePath(); tx.fill();\n  // stream\n  if (pumping && frac < 1) {\n    tx.strokeStyle = '#4fc3f7'; tx.lineWidth = 2 + q / 60 * 8; tx.setLineDash([8, 6]); tx.lineDashOffset = -now * 0.06;\n    tx.beginPath(); tx.moveTo(px, tt + 4); tx.lineTo(px, wy); tx.stroke(); tx.setLineDash([]); tx.lineDashOffset = 0;\n  }\n  // tank walls and scale\n  tx.strokeStyle = '#cfd8dc'; tx.lineWidth = 4; tx.beginPath(); tx.moveTo(tl, tt); tx.lineTo(tl, tb); tx.lineTo(tr, tb); tx.lineTo(tr, tt); tx.stroke();\n  tx.font = '11px Arial'; tx.textAlign = 'right';\n  [0, 100, 200, 300, 400].forEach(L => {\n    const y = tb - L / 400 * th; tx.strokeStyle = L === 400 ? '#ff5252' : '#90a4ae'; tx.lineWidth = 1; tx.setLineDash(L === 400 ? [6, 4] : []);\n    tx.beginPath(); tx.moveTo(tl - 8, y); tx.lineTo(tr, y); tx.stroke(); tx.setLineDash([]);\n    tx.fillStyle = L === 400 ? '#ff8a80' : '#cfd8dc'; tx.fillText(L + ' L', tl - 12, y + 4);\n  });\n  tx.fillStyle = '#ff8a80'; tx.textAlign = 'left'; tx.fillText('max capacity 400 L', tl + 6, tt + 14);\n  tx.fillStyle = '#fff'; tx.font = 'bold 15px Arial'; tx.textAlign = 'center';\n  tx.fillText(fix(v) + ' L  (' + Math.round(frac * 100) + '%)', (tl + tr) / 2, Math.min(tb - 12, Math.max(tt + 36, wy + 22)));\n  tx.fillStyle = '#4fc3f7'; tx.font = 'bold 13px Arial'; tx.textAlign = 'left';\n  tx.fillText('Q = ' + fix(q) + ' L/min', w * 0.04, h * 0.42);\n  tx.fillStyle = pumping ? '#69f0ae' : '#ff8a80';\n  tx.fillText(pumping ? 'Pump ON' : (frac >= 0.999 ? 'TANK FULL – pump stops' : 'Pump OFF (10 min over)'), w * 0.04, h * 0.5);\n  tx.fillStyle = '#cfe8ff'; tx.fillText('t = ' + t.toFixed(2) + ' min', w * 0.04, h * 0.58);\n}\n\n/* ---------- graphs ---------- */\nfunction drawGraphs() {\n  fit(gr, 1.0);\n  const w = gr.width, h = gr.height, L = 52, R = 14, B = 30, ph = (h - B) / 2, pw = w - L - R;\n  const X = u => L + u / 12 * pw;\n  gx.clearRect(0, 0, w, h);\n  const panels = [\n    { top: 8, hh: ph - 18, max: 78, f: Q, col: '#4fc3f7', lab: 'Q (L/min)', ticks: [0, 20, 40, 60] },\n    { top: ph + 8, hh: ph - 18, max: 510, f: V, col: '#80deea', lab: 'V (litres)', ticks: [0, 100, 200, 300, 400] }\n  ];\n  panels.forEach((P, k) => {\n    const Y = y => P.top + P.hh - y / P.max * P.hh;\n    gx.fillStyle = 'rgba(255,255,255,.03)'; gx.fillRect(L, P.top, pw, P.hh);\n    gx.font = '11px Arial'; gx.strokeStyle = '#2b4468'; gx.lineWidth = 1;\n    P.ticks.forEach(v => { gx.beginPath(); gx.moveTo(L, Y(v)); gx.lineTo(L + pw, Y(v)); gx.stroke(); gx.fillStyle = P.col; gx.textAlign = 'right'; gx.fillText(v, L - 5, Y(v) + 4); });\n    for (let q = 0; q <= 12; q++) { gx.beginPath(); gx.moveTo(X(q), P.top); gx.lineTo(X(q), P.top + P.hh); gx.stroke(); if (k === 1 && q % 2 === 0) { gx.fillStyle = '#9fb3cc'; gx.textAlign = 'center'; gx.fillText(q, X(q), h - 14); } }\n    gx.fillStyle = P.col; gx.font = 'bold 12px Arial'; gx.textAlign = 'left'; gx.fillText(P.lab, 4, P.top + 12);\n    if (k === 1) { gx.fillStyle = '#fff'; gx.textAlign = 'center'; gx.fillText('time t (min)', L + pw / 2, h - 2); }\n    if (!bonus) { gx.fillStyle = 'rgba(120,120,120,.2)'; gx.fillRect(X(10), P.top, X(12) - X(10), P.hh); gx.fillStyle = '#b0bec5'; gx.font = '10px Arial'; gx.textAlign = 'center'; gx.fillText('pump off', X(11), P.top + 12); }\n    const curve = (a, b, col, lw, dash) => { gx.strokeStyle = col; gx.lineWidth = lw; gx.setLineDash(dash || []); gx.beginPath(); for (let u = a, i = 0; u <= b + 1e-9; u += 0.02, i++) i ? gx.lineTo(X(u), Y(P.f(u))) : gx.moveTo(X(u), Y(P.f(u))); gx.stroke(); gx.setLineDash([]); };\n    if (k === 0) {\n      const area = (a, b, col) => { if (b <= a) return; gx.fillStyle = col; gx.beginPath(); gx.moveTo(X(a), Y(0)); for (let u = a; u <= b + 1e-9; u += 0.02) gx.lineTo(X(u), Y(Q(u))); gx.lineTo(X(b), Y(0)); gx.closePath(); gx.fill(); };\n      area(0, Math.min(t, 5), 'rgba(0,229,255,.38)'); area(5, Math.min(t, 10), 'rgba(255,152,0,.42)');\n      if (bonus && t > 10) area(10, t, 'rgba(171,71,188,.4)');\n      gx.font = 'bold 12px Arial'; gx.textAlign = 'center';\n      if (t >= 5) { gx.fillStyle = '#00e5ff'; gx.fillText('112.5 L', X(2.5), Y(5) - 2); }\n      if (t >= 10) { gx.fillStyle = '#ffb74d'; gx.fillText('237.5 L', X(7.5), Y(5) - 2); gx.fillStyle = '#b9f6ca'; gx.fillText('Total = 350 L', X(5), Y(Q(5)) - 20); }\n      if ($('rs').checked) {\n        const n = +$('ns').value, dt = 10 / n; gx.strokeStyle = 'rgba(255,255,255,.7)'; gx.lineWidth = 1;\n        for (let i = 0; i < n; i++) gx.strokeRect(X(i * dt), Y(Q(i * dt)), X(dt) - X(0), Y(0) - Y(Q(i * dt)));\n      }\n    }\n    curve(0, 12, P.col + '44', 2, [5, 5]); curve(0, t, P.col, 3.5);\n    if (k === 1) {\n      const y400 = Y(400); gx.strokeStyle = '#ff5252'; gx.setLineDash([6, 4]); gx.beginPath(); gx.moveTo(L, y400); gx.lineTo(L + pw, y400); gx.stroke(); gx.setLineDash([]);\n      gx.fillStyle = '#ff8a80'; gx.font = '11px Arial'; gx.textAlign = 'left'; gx.fillText('capacity 400 L', L + 6, y400 - 4);\n      gx.fillStyle = '#ffeb3b'; gx.fillText('t = 10.81 min: tank full', X(TFULL) - 126, Y(400) + 15);\n      [[5, 112.5], [10, 350], [TFULL, 400]].forEach(([a, b]) => { gx.beginPath(); gx.arc(X(a), Y(b), 4, 0, 7); gx.strokeStyle = '#ffeb3b'; gx.lineWidth = 2; gx.stroke(); });\n      gx.fillStyle = '#ffeb3b'; gx.textAlign = 'left'; gx.fillText('(5, 112.5)', X(5) + 6, Y(112.5) + 14); gx.fillText('(10, 350)', X(10) + 6, Y(350) + 14);\n    } else {\n      [[5, 35], [10, 60]].forEach(([a, b]) => { gx.beginPath(); gx.arc(X(a), Y(b), 4, 0, 7); gx.strokeStyle = '#ffeb3b'; gx.lineWidth = 2; gx.stroke(); gx.fillStyle = '#ffeb3b'; gx.font = '11px Arial'; gx.textAlign = 'left'; gx.fillText('Q(' + a + ') = ' + b, X(a) + 6, Y(b) - 6); });\n    }\n    const yv = P.f(t), m = k === 0 ? 5 : Q(t), dt = 0.8;\n    gx.strokeStyle = '#fff'; gx.lineWidth = 2; gx.beginPath(); gx.moveTo(X(t - dt), Y(yv - dt * m)); gx.lineTo(X(t + dt), Y(yv + dt * m)); gx.stroke();\n    gx.fillStyle = P.col; gx.beginPath(); gx.arc(X(t), Y(yv), 6, 0, 7); gx.fill(); gx.strokeStyle = '#fff'; gx.lineWidth = 2; gx.stroke();\n    gx.fillStyle = '#fff'; gx.font = '11px Arial'; gx.textAlign = X(t) > w * 0.7 ? 'right' : 'left';\n    gx.fillText(k === 0 ? 'Q = ' + fix(yv) : 'V = ' + fix(yv) + ' (slope = Q = ' + fix(Q(t)) + ')', X(t) + (X(t) > w * 0.7 ? -10 : 10), Y(yv) - 10);\n  });\n  gx.strokeStyle = '#ffffff88'; gx.setLineDash([4, 4]); gx.beginPath(); gx.moveTo(X(t), 4); gx.lineTo(X(t), h - B); gx.stroke(); gx.setLineDash([]);\n}\n\nfunction readout() {\n  const v = V(t), n = +$('ns').value, dt = 10 / n; let rsum = 0;\n  for (let i = 0; i < n; i++) rsum += Q(i * dt) * dt;\n  $('nl').textContent = n;\n  $('read').innerHTML =\n    `t = <b>${t.toFixed(2)} min<\/b><br>` +\n    `<span class=\"q\">Q(t) = 5t + 10 = 5(${t.toFixed(2)}) + 10 = ${fix(Q(t))} L/min<\/span><br>` +\n    `<span class=\"vol\">V(t) = ∫₀ᵗ (5u + 10) du = 2.5t² + 10t = ${fix(v)} L<\/span><br>` +\n    `Tank filled: ${Math.round(Math.min(v, 400) / 4)}% · Remaining capacity: ${fix(Math.max(0, 400 - v))} L` +\n    ($('rs').checked ? `<br>Riemann sum (n = ${n}): ${fix(rsum)} L → exact area = 350 L` : '');\n}\n\n/* ---------- solution panel ---------- */\nconst steps = [\n  ['1. Expression for total water', 'Flow rate is the rate of change of volume: Q = dV/dt. Adding up small amounts Q·dt over 10 minutes gives<br><span class=\"res\">V = ∫₀¹⁰ Q(t) dt = ∫₀¹⁰ (5t + 10) dt<\/span>', null],\n  ['2. Indefinite integral', 'Use ∫tⁿ dt = tⁿ⁺¹/(n + 1) and ∫k dt = kt:<br>∫(5t + 10) dt = 5·t²/2 + 10t + C = <span class=\"res\">2.5t² + 10t + C<\/span><br>Tank empty at start: V(0) = 0 → C = 0, so V(t) = 2.5t² + 10t.', null],\n  ['3. Total water after 10 min', 'V = [2.5t² + 10t]₀¹⁰ = (2.5·100 + 10·10) − 0 = 250 + 100 = <span class=\"res\">350 litres<\/span>', 10],\n  ['4. First 5 minutes', 'V = [2.5t² + 10t]₀⁵ = 2.5(25) + 10(5) = 62.5 + 50 = <span class=\"res\">112.5 litres<\/span>', 5],\n  ['5. Between 5 and 10 minutes', 'V = [2.5t² + 10t]₅¹⁰ = 350 − 112.5 = <span class=\"res\">237.5 litres<\/span><br>Check: 112.5 + 237.5 = 350 ✔', 10],\n  ['6. Flow rate at t = 5 and t = 10', 'Q(5) = 5(5) + 10 = <span class=\"res\">35 L/min<\/span><br>Q(10) = 5(10) + 10 = <span class=\"res\">60 L/min<\/span>', 5],\n  ['7. The flow-rate graph', 'Q = 5t + 10 is a straight line from (0, 10) to (10, 60), with slope 5 L/min per minute: the flow increases steadily.', null],\n  ['8. Area under the graph = volume', 'Units: (L/min) × (min) = L. The area under the Q–t graph from 0 to 10 is a trapezoid:<br>Area = ½ (10 + 60) × 10 = <span class=\"res\">350 L<\/span>, the same as the definite integral.<br>Thin strips Q·Δt add up to the area; as the strips get thinner (use the Riemann slider) the sum approaches ∫Q dt. Slope of the V–t curve is Q.', null],\n  ['Bonus: time to fill 400 L', 'Solve 2.5t² + 10t = 400 → t² + 4t − 160 = 0<br>t = [−4 ± √(16 + 640)]/2 = (−4 ± 25.61)/2 → <span class=\"res\">t ≈ 10.81 min<\/span> (reject the negative root).<br>After 10 min the tank holds only 350 L (87.5%), so the pump must run about 0.81 min (≈ 48 s) longer. Tick the bonus box to watch it fill.', 'bonus'],\n  ['Real-life uses', '• Flow meters and PLCs integrate flow rate to measure delivered volume.<br>• Engineers size pumps and tanks and predict filling time.<br>• The same idea gives distance from speed, charge from current and work from force.', null]\n];\n$('sol').innerHTML = steps.map((s, i) => `<div class=\"st ${s[2] !== null ? 'go' : ''}\" style=\"animation-delay:${0.3 + i * 0.4}s\" ${s[2] !== null ? `onclick=\"jump('${s[2]}')\"` : ''}><b class=\"h\">${s[0]}<\/b>${s[2] !== null ? ' <span style=\"font-size:.75rem;color:#ffd54f\">(click to show)<\/span>' : ''}<br>${s[1]}<\/div>`).join('');\n\n/* ---------- controls and loop ---------- */\nfunction setBonus(b) { bonus = b; $('bonus').checked = b; if (t > tmax()) t = tmax(); }\nfunction jump(x) {\n  if (x === 'bonus') { setBonus(true); t = TFULL; } else { t = +x; if (t > 10) setBonus(true); else if (!bonus && t > tmax()) t = tmax(); }\n  playing = false; $('play').textContent = '▶ Play'; $('ts').value = t * 100;\n}\n$('bonus').onchange = e => { bonus = e.target.checked; if (t > tmax()) t = tmax(); };\n$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '⏸ Pause' : '▶ Play'; if (playing && t >= tmax() - 1e-9) t = 0; };\n$('spd').oninput = e => speed = +e.target.value;\n$('ts').oninput = e => { playing = false; $('play').textContent = '▶ Play'; t = Math.min(e.target.value / 100, tmax()); };\nfunction loop(now) {\n  const dt = (now - last) / 1000; last = now;\n  if (playing) { t += dt * 0.8 * speed; if (t > tmax() + 1.2) t = 0; if (t > tmax()) t = tmax(); $('ts').value = t * 100; }\n  drawTank(now); drawGraphs(); readout();\n  requestAnimationFrame(loop);\n}\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>"}];
const tabs = document.getElementById('tabs'), stage = document.getElementById('stage');

}

const m = /^#p(\d+)$/.exec(location.hash), start = m ? Math.min(Math.max(+m[1] - 1, 0), PAGES.length - 1) : 0;
